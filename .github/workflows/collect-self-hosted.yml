name: collect self-hosted

# The same discovery and fetch stages as collect, for the outlets whose feeds refuse
# GitHub's runner addresses (collector: self_hosted in sources/outlets.yaml). Runs on a
# self-hosted runner on the owner's own network. Shares the database through the same
# cache and the same concurrency group, so there is still one writer at a time. If no
# self-hosted runner is online the job simply waits and is cancelled by the timeout;
# it does not open failure issues.

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

concurrency:
  group: tracker-database
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: self-hosted
    timeout-minutes: 40
    env:
      TRACKER_COLLECTOR: self_hosted
      TRACKER_CONTACT: ${{ vars.TRACKER_CONTACT }}
      TRACKER_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Restore database from the most recent run
        uses: actions/cache/restore@v5
        with:
          path: |
            data/tracker.db
            data/bodies
          key: tracker-db-${{ github.run_id }}
          restore-keys: tracker-db-
      - name: Fall back to the snapshot or seed if no cache
        run: scripts/db_restore.sh
      - name: Discover and fetch the self-hosted outlets
        run: python -X faulthandler -m pipeline.run all --no-llm --budget-minutes 30
      - name: Save database for the next run
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            data/tracker.db
            data/bodies
          key: tracker-db-${{ github.run_id }}
