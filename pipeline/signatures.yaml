    regex: "(?i)\\b(selon|d.après|rapporte|a rapporté|cité par|citée par|indique|selon l.agence)\\s+(l.agence\\s+|l.agence de presse\\s+|les\\s+|la\\s+|le\\s+)?(Xinhua|Chine nouvelle|médias (d.État|officiels|étatiques|publics) chinois|presse (officielle|d.État) chinoise|télévision (d.État|publique|officielle) chinoise|agence (officielle|d.État) chinoise|CGTN|Global Times|China Daily|CCTV|Quotidien du Peuple)|\\b(médias|presse|télévision|agence)\\s+(d.État|officiel(le|s)?|étatique(s)?|publique)\\s+chinois(e)?\\b"
  - id: state_media_reported_es
    regex: "(?i)\\b(según|citad[oa] por|informó|reportó|de acuerdo con|indicó)\\s+(la\\s+)?(agencia\\s+)?(estatal\\s+)?(china\\s+)?(Xinhua|medios (estatales|oficiales) chinos|prensa (estatal|oficial) china|televisión (estatal|oficial) china|CGTN|Global Times|China Daily|CCTV|Diario del Pueblo)|\\b(medios|prensa|televisión|agencia)\\s+(estatal(es)?|oficial(es)?)\\s+chin[ao]s?\\b"
  - id: state_media_reported_pt
    regex: "(?i)\\b(segundo|de acordo com|citad[oa] pela|informou|noticiou|reportou)\\s+(a\\s+)?(agência\\s+)?(estatal\\s+)?(chinesa\\s+)?(Xinhua|mídia (estatal|oficial) chinesa|imprensa (estatal|oficial) chinesa|televisão (estatal|oficial) chinesa|CGTN|Global Times|China Daily|CCTV|Diário do Povo)|\\b(mídia|imprensa|televisão|agência)\\s+(estatal|oficial)\\s+chinesa\\b"
  - id: state_media_reported_de
    regex: "(?i)\\b(laut|nach angaben|wie|berichtete|meldete|zitiert|gemäß|so)\\s+(der\\s+|die\\s+|das\\s+)?(staatlichen?\\s+|amtlichen?\\s+|offiziellen?\\s+)?(chinesischen?\\s+)?(Nachrichtenagentur\\s+)?(Xinhua|Staatsmedien|Staatsfernsehen|Staatsagentur|CGTN|Global Times|China Daily|CCTV|Volkszeitung)|\\b(chinesische[nrs]?|Chinas)\\s+(Staatsmedien|Staatsfernsehen|staatliche[nrs]? (Medien|Nachrichtenagentur|Fernsehen))\\b"
  - id: state_media_reported_other
    regex: "(?i)(государственн(ые|ых|ым|ому) (СМИ|телевидение|агентство)|по данным Синьхуа|сообщает Синьхуа|со ссылкой на Синьхуа|китайские государственные СМИ|وسائل الإعلام الرسمية الصينية|الإعلام الحكومي الصيني|وفقا لوكالة شينخوا|نقلا عن شينخوا|中国国営メディア|国営メディア|新華社によると|중국 관영 매체|관영 매체|신화통신에 따르면|truyền thông nhà nước Trung Quốc|theo Tân Hoa Xã|media pemerintah (China|Tiongkok)|kantor berita Xinhua|melaporkan Xinhua|สื่อของรัฐจีน|สำนักข่าวซินหัว|चीनी सरकारी मीडिया|शिन्हुआ के अनुसार|państwowe media|chińska agencja Xinhua|státní média|čínská agentura|állami média|presa de stat chineză|κρατικά μέσα|devlet medyası|Çin devlet medyası)"
