    note: 'Added in ruleset 2026.10.1. Counterpart of chinese_state_body_en in Croatian, Bosnian, Serbian, Macedonian, Bulgarian, Ukrainian, Greek, Polish, Czech, Slovak, Hungarian, Romanian, Turkish, Thai, Persian, Hindi and Nepali, and Hebrew: a Chinese ministry, the State Council, the statistics bureau, customs or the police, with China in the name of the body, and a reporting verb in the same sentence or just before it ("priopćilo je kinesko ministarstvo vanjskih poslova", "Ministerstwo Handlu Chin odrzuciło", "közölte a kínai kereskedelmi minisztérium", "กระทรวงพาณิชย์จีนประกาศ", "وزارت امور خارجه چین اعلام کرد"). The police count here as in the other languages; chinese_police_statement stays English. A minister is not the ministry ("Çin Dışişleri Bakanı", "รัฐมนตรีว่าการกระทรวงกลาโหม"), and a joint police patrol with no statement does not fire.'
