# Deterministic signature patterns for Category A detection and for routing to the
# LLM. Every match records the pattern id so any Category A count can be broken
# down by mechanism.
#
# Fields per pattern:
#   id        stable identifier, never reuse after removal
#   regex     Python regex, applied with re.MULTILINE and re.UNICODE. Use (?i) for
#             case insensitive patterns; credit lines are usually case sensitive.
#   strength  strong  = one match alone gives Category A with confidence 1.0
#             weak    = needs a second weak match from a different group, otherwise
#                       the article is routed to the LLM as an A candidate
#             hint    = never contributes to a Category A decision; only routes the
#                       article to the LLM as an A candidate. Used for markers that
#                       identify a distribution channel without saying who issued it.
#   scope     author  = the article's author field only
#             head    = first 400 characters of the body
#             tail    = last 600 characters of the body
#             body    = whole body (default)
#             any     = author, title and body
#             disclosure = author, page labels, head and tail, read with post_check
#                       disclosure_marker (classify_rules.DISCLOSURE_CHECK)
#   note      why this pattern exists
#
# Decision rule (classify_rules.py): any strong match, or weak matches from two
# different groups, gives Category A with confidence 1.0 and no LLM call. One
# weak match routes to the LLM as an A candidate. Exclusions are applied first
# and remove the matched span from the text before patterns run.
ruleset_version: "2026.10.2"

# Spans removed before matching, so a photo credit is not read as a text credit.
exclusions:
  - id: photo_credit
    regex: '(?i)\b(photo|foto|image|immagine|picture|pic|fotografía|photographie|bild|credit|crédit|crediti)\s*(credit|by|di|de|par|:)?\s*[:/]?\s*(Xinhua|CGTN|China Daily|Global Times|VCG|Imaginechina)[^\n.]{0,40}'
  - id: photo_paren
    regex: '\((?:Photo|Foto|Image|Immagine|Pic)[^)]{0,40}(?:Xinhua|CGTN|VCG)[^)]{0,40}\)'
  - id: photo_credit_native
    regex: '(?i)(사진|寫真|写真|图片|圖片|照片|Φωτογραφία|Φωτο|צילום|תצלום|عکس|تصویر|صورة|الصورة|Ảnh|Fotoğraf)\s*[=:：／/]?\s*[（(]?\s*(Σινχούα|Σινχουά|Σίνχουα|Σινχουα|Ξινχούα|Ξινχουά|Ξίνχουα|Ξινχουα|שינחואה|סינחואה|شین[\u200c ]?هوا|Şinhua|Tân Hoa Xã|Tân Hoa xã|Синьхуа|شينخوا|شينهوا|신화통신|신화사|新華社|新华社|中新社|中国日报|中國日報)\s*[)）]?'
    note: The native script counterpart of photo_credit. A picture credit is not a text credit, and it has to be removed before the native credit patterns read a name standing alone on a line.
  - id: xinhua_via_ap_photo
    regex: '(?i)Xinhua via (AP|Getty|Reuters)[^\n.]{0,40}'
  - id: photo_caption_source_colon
    regex: '\(\s*(?:Reuters|AP|AFP|AAP|EPA|Getty Images|Getty|Supplied|ABC News|Weibo|WeChat|Douyin|X|Twitter|Facebook|Instagram|YouTube|Bilibili|RedNote|Xiaohongshu|Handout)\s*:\s*(?:Xinhua|CGTN|China Daily|Global Times|CCTV|People[’'']s Daily|China News Service|CNS|VCG|Imaginechina)[^()\n]{0,40}\)'
    note: 'Added in ruleset 2026.10.1. The ABC caption form "(source: photographer)" with a state outlet in the photographer place, "( Reuters: China Daily )" and "( Weibo: Xinhua )", is a picture credit; the Australian audit found it sending articles to the model for nothing. Only inside parentheses and only after a photo agency or platform name, so "Source: Xinhua" and "(Reuters/Xinhua)" are untouched.'
  - id: photo_handout_via_state
    regex: '(?i)\b(?:[\w.]+\s*/\s*)?Handout\s*(?:via|/)\s*(?:Xinhua|CGTN|China Daily|Global Times|CCTV|People[’'']s Daily|China News Service|CNS|VCG|Imaginechina)\b[^\n.)]{0,40}|(?:^|[(/])[ \t]*(?:Xinhua|CGTN|China Daily|Global Times|CCTV|People[’'']s Daily|China News Service|CNS|VCG|Imaginechina)(?:\s*/\s*(?:VCG|Imaginechina))?[ \t]+via[ \t]+(?:Getty Images|Getty|AP|AFP|Reuters|EPA)\b[^\n()]{0,20}?(?=\)|[ \t]*$)'
    note: 'Added in ruleset 2026.10.1. Picture credits that pass through a state outlet or reach one through a photo agency: "(KCNA/Handout via Xinhua)", "(Wang Gang/ China News Service /VCG via Getty Images)" and "China Daily via Reuters" alone on a caption line. The via form counts only inside parentheses, after a slash or alone on its line, so "according to Xinhua via Reuters" in a sentence is not touched by this pattern; text credits such as "(AFP/Xinhua)" and "WASHINGTON/Xinhua" carry no via and stay.'
  - id: syndication_disclaimer
    regex: '(?i)\(?(except for the headline,?\s*)?this (article|story|report|content) (has|was) (not been edited|been published|auto-?generated|not been modified)[^\n)]{0,160}\)?|\(?this (story|article) (has been|is) (published|generated) (from|by) a (wire|syndicated|third[- ]party) (agency )?feed[^\n)]{0,120}\)?|disclaimer: this (article|story|content)[^\n]{0,160}'
    note: Indian and other syndication boilerplate ("Except for the headline, this article has not been edited by ...") names a wire agency, not a sponsor. Removed before the sponsored placement patterns run.
  - id: nst_recirc_boilerplate
    regex: '(?i)What To Read Next\s*\n\s*Featured Video\s*\n\s*Latest\s*\n\s*What To Read Next\s*\n\s*Branded Content'
    note: Added in ruleset 2026.09.9. New Straits Times (my_nst) extracts a fixed five-line "recirculation" widget ahead of every article's actual text, and its own literal label "Branded Content" is one of the phrases sponsored_en, sponsored_it, sponsored_es, sponsored_pt and sponsored_nl all match, so unrelated sports and entertainment stories fired all five at once. Traced to 49 September model calls at this outlet carrying only that span, 48 not_relevant and 1 C. The regex requires the whole five-line widget, not the bare phrase, so a genuine "Branded Content" disclosure on a real sponsored piece is untouched.
  - id: bharian_nav_menu_boilerplate
    regex: '(?i)Infografik\s*\n\s*Langgan\s*\n\s*Akhbar Digital\s*\n\s*Akhbar BH\s*\n\s*Perkhidmatan\s*\n\s*Iklan Web\s*\n\s*1Klassifieds\s*\n\s*NSTP KLiK\s*\n\s*Radio\s*\n\s*Dapatkan Audio'
    note: Added in ruleset 2026.09.9. Berita Harian (my_bharian) extracts its own ten-item site navigation menu ahead of every article's actual text, and the menu item "Iklan Web" (web advertising) is enough to fire the sponsored_asia weak signature on unrelated stories. Traced to 51 September model calls at this outlet carrying only that span, 47 not_relevant, 2 B and 2 C. The regex requires the whole navigation sequence, not the bare word, so a genuine sponsored-content disclosure elsewhere in a Malay-language body is untouched.

groups:
  credit_dateline:
    description: Wire credit lines and datelines showing the text came from a Chinese state outlet.
    patterns:
      - id: xinhua_dateline
        regex: '(?m)^[^\n]{0,60}\(Xinhua\)'
        strength: strong
        note: Classic wire dateline, for example "BEIJING, Sept. 2 (Xinhua) -- ".
      - id: xinhua_paren_inline
        regex: '\(Xinhua\)\s*(--|—|-|–)'
        strength: strong
        note: Dateline form with the wire dash, even when not at line start.
      - id: xinhua_slash_credit
        regex: '(?im)^[^\n]{0,80}\(\s*XINHUA\s*(/\s*[A-Z][A-Za-z]+)?\s*\)\s*(--|—|-|–)'
        strength: strong
        note: Italian agency syndication form "PECHINO (CINA) (XINHUA/ITALPRESS) –".
      - id: source_xinhua
        regex: '(?m)^\s*SOURCE:?\s+Xinhua(\s+Silk\s+Road)?(\s+News\s+Agency)?\s*$'
        strength: strong
        note: Release wire trailer "SOURCE Xinhua" or "SOURCE Xinhua Silk Road".
      - id: xinhua_credit_line
        regex: '(?im)^\s*(source|fonte|credit|crediti|quelle|fuente|origine|por|by|di|par|von|editing by|editor)\s*[:：]?\s*(the\s+)?Xinhua(\s+News\s+Agency)?(([ \u00a0\u3000]*[,，|｜/·][ \u00a0\u3000]*|[ \u00a0\u3000]+)(\d{4}[-/.年]\d{1,2}[-/.月]\d{1,2}日?|\d{1,2}[-/.]\d{1,2}[-/.]\d{4}|\d{1,2}[ \u00a0]+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?[ \u00a0]+\d{4}|(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?[ \u00a0]+\d{1,2},?[ \u00a0]+\d{4})([ \u00a0\u3000]+\d{1,2}:\d{2}(:\d{2})?)?)?\s*(\.|$)'
        strength: strong
        note: Explicit credit line naming Xinhua as the source of the text.
      - id: xinhua_co_credit_author
        regex: '(?i)(^|[;,/|]|\band\b)\s*(Agenzia\s+)?Xinhua(\s+News\s+Agency)?\s*$'
        strength: strong
        scope: author
        note: 'A co-credited byline, for example Antaranews Com followed by Xinhua. The wire is named as an author of the text, not cited in it.'
      - id: xinhua_translator_credit
        regex: '(?im)^\s*(penerjemah|penterjemah|sumber|fonte|source|traduzione)\s*[:：]\s*(agenzia\s+)?Xinhua\b'
        strength: strong
        scope: tail
        note: 'Trailer on republished wire copy, for example Antara translator credits naming Xinhua.'
      - id: xinhua_author_field
        regex: '(?i)^\s*(Xinhua|Xinhua News Agency|Agenzia Xinhua|Agence Xinhua|Agencia Xinhua)\s*$'
        strength: strong
        scope: author
      - id: xinhua_wire_end
        regex: '(?im)^\s*\(?\s*(Xinhua|Xinhua News Agency)\s*\)?\s*$'
        strength: strong
        scope: tail
        note: A bare "Xinhua" on its own line at the end of the article is a wire credit.
      - id: china_daily_credit
        regex: '(?im)^\s*(source|fonte|credit|crediti|quelle|fuente|by|di|par|von)\s*[:：]?\s*(the\s+)?China\s+Daily(([ \u00a0\u3000]*[,，|｜/·][ \u00a0\u3000]*|[ \u00a0\u3000]+)(\d{4}[-/.年]\d{1,2}[-/.月]\d{1,2}日?|\d{1,2}[-/.]\d{1,2}[-/.]\d{4}|\d{1,2}[ \u00a0]+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?[ \u00a0]+\d{4}|(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?[ \u00a0]+\d{1,2},?[ \u00a0]+\d{4})([ \u00a0\u3000]+\d{1,2}:\d{2}(:\d{2})?)?)?\s*(\.|$)|^[^\n]{0,60}\(China Daily\)\s*(--|—|-|–)'
        strength: strong
      - id: china_daily_author
        regex: '(?i)^\s*China\s+Daily(\s+Global)?\s*$'
        strength: strong
        scope: author
      - id: global_times_credit
        regex: '(?im)^\s*(source|fonte|credit|crediti|quelle|fuente|by|di|par|von)\s*[:：]?\s*(the\s+)?Global\s+Times(([ \u00a0\u3000]*[,，|｜/·][ \u00a0\u3000]*|[ \u00a0\u3000]+)(\d{4}[-/.年]\d{1,2}[-/.月]\d{1,2}日?|\d{1,2}[-/.]\d{1,2}[-/.]\d{4}|\d{1,2}[ \u00a0]+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?[ \u00a0]+\d{4}|(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?[ \u00a0]+\d{1,2},?[ \u00a0]+\d{4})([ \u00a0\u3000]+\d{1,2}:\d{2}(:\d{2})?)?)?\s*(\.|$)|^[^\n]{0,60}\(Global Times\)\s*(--|—|-|–)'
        strength: strong
      - id: global_times_author
        regex: '(?i)^\s*Global\s+Times\s*$'
        strength: strong
        scope: author
      - id: cgtn_credit
        regex: '(?im)^\s*(source|fonte|credit|crediti|quelle|fuente|by|di|par|von)\s*[:：]?\s*CGTN([ \u00a0]+(Radio|Digital|Africa|America|Europe|Fran[cç]ais))?(([ \u00a0\u3000]*[,，|｜/·][ \u00a0\u3000]*|[ \u00a0\u3000]+)(\d{4}[-/.年]\d{1,2}[-/.月]\d{1,2}日?|\d{1,2}[-/.]\d{1,2}[-/.]\d{4}|\d{1,2}[ \u00a0]+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?[ \u00a0]+\d{4}|(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?[ \u00a0]+\d{1,2},?[ \u00a0]+\d{4})([ \u00a0\u3000]+\d{1,2}:\d{2}(:\d{2})?)?)?\s*(\.|$)|^[^\n]{0,60}\(CGTN([ \u00a0]+(Radio|Digital|Africa|America|Europe|Fran[cç]ais))?\)\s*(--|—|-|–)'
        strength: strong
        note: 'The parenthetical form must be a dateline ("BEIJING (CGTN) --"), because prose that expands the acronym, "China Global Television Network (CGTN) released", is a report about CGTN and not CGTN copy. Since ruleset 2026.10.1 the credit and the dateline also read the CGTN services by name: CGTN Radio, which China Radio International''s English site (english.cri.cn) now serves under, CGTN Digital, CGTN Africa (the byline on its own site, newsaf.cgtn.com), CGTN America, CGTN Europe and CGTN Français. "Source: CGTN Radio" matched nothing before, because the name had to stand alone on the line. Also since 2026.10.1 the credit line takes a full width colon and a trailing date, as english.sdchina.com writes it ("Source：CGTN 2026-09-06"), and so do the other Latin credit lines (Xinhua, China Daily, Global Times, People''s Daily, China News Service, CRI, China Media Group); a line that goes on with words after the name ("Source: CGTN reports that") still does not count.'
      - id: cgtn_bare_line_tail
        regex: '(?m)^\s*CGTN([ \u00a0]+(Radio|Digital|Africa|America|Europe|Fran[cç]ais))?\s*$'
        strength: strong
        scope: tail
        note: A bare "CGTN" line counts only at the end of the body, where a credit sits. In the middle of a body it is a section heading, as in an Indian Express explainer that surveys Chinese outlets under headings "Xinhua", "CGTN", "Global Times".
      - id: cgtn_author
        regex: '(?i)^\s*(CGTN([ \u00a0]+(Radio|Digital|Africa|America|Europe|Fran[cç]ais))?|China Global Television Network)\s*$'
        strength: strong
        scope: author
      - id: china_media_group_credit
        regex: '(?im)\bChina Media Group\b.{0,40}\b(release|press release|comunicato|communiqué)|^\s*(source|fonte)\s*[:：]?\s*China Media Group(([ \u00a0\u3000]*[,，|｜/·][ \u00a0\u3000]*|[ \u00a0\u3000]+)(\d{4}[-/.年]\d{1,2}[-/.月]\d{1,2}日?|\d{1,2}[-/.]\d{1,2}[-/.]\d{4}|\d{1,2}[ \u00a0]+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?[ \u00a0]+\d{4}|(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?[ \u00a0]+\d{1,2},?[ \u00a0]+\d{4})([ \u00a0\u3000]+\d{1,2}:\d{2}(:\d{2})?)?)?\s*$'
        strength: strong
        note: 'The name must be spelled out. Ruleset 2026.09.8 dropped the bare acronym: CMG is the Toronto ticker of Computer Modelling Group Ltd, whose annual meeting releases carry "press release" within a few words of it, and the Canadian count was 19 percent company filings.'
      - id: peoples_daily_credit
        regex: "(?im)^\\s*(source|fonte|credit|crediti|by|di|par)\\s*[:：]?\\s*(the\\s+)?People'?s\\s+Daily(\\s+Online)?(([ \\u00a0\\u3000]*[,，|｜/·][ \\u00a0\\u3000]*|[ \\u00a0\\u3000]+)(\\d{4}[-/.年]\\d{1,2}[-/.月]\\d{1,2}日?|\\d{1,2}[-/.]\\d{1,2}[-/.]\\d{4}|\\d{1,2}[ \\u00a0]+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\\.?[ \\u00a0]+\\d{4}|(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\\.?[ \\u00a0]+\\d{1,2},?[ \\u00a0]+\\d{4})([ \\u00a0\\u3000]+\\d{1,2}:\\d{2}(:\\d{2})?)?)?\\s*(\\.|$)|^[^\\n]{0,60}\\(People'?s Daily\\)\\s*(--|—|-|–)"
        strength: strong
      - id: peoples_daily_author
        regex: "(?i)^\\s*People'?s\\s+Daily(\\s+Online)?\\s*$"
        strength: strong
        scope: author
      - id: china_news_service_credit
        regex: '(?im)^\s*(source|fonte|credit|by|di)\s*[:：]?\s*(China News Service|ECNS|ecns\.cn)(([ \u00a0\u3000]*[,，|｜/·][ \u00a0\u3000]*|[ \u00a0\u3000]+)(\d{4}[-/.年]\d{1,2}[-/.月]\d{1,2}日?|\d{1,2}[-/.]\d{1,2}[-/.]\d{4}|\d{1,2}[ \u00a0]+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?[ \u00a0]+\d{4}|(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?[ \u00a0]+\d{1,2},?[ \u00a0]+\d{4})([ \u00a0\u3000]+\d{1,2}:\d{2}(:\d{2})?)?)?\s*(\.|$)|^[^\n]{0,60}\((China News Service|ECNS)\)\s*(--|—|-|–)'
        strength: strong
      - id: cri_credit
        regex: '(?im)^\s*(source|fonte|credit|by|di)\s*[:：]?\s*(China Radio International|China Plus|(?-i:CRI[ \u00a0]?(Online|ONLINE|English|ENGLISH)))(\.com)?(([ \u00a0\u3000]*[,，|｜/·][ \u00a0\u3000]*|[ \u00a0\u3000]+)(\d{4}[-/.年]\d{1,2}[-/.月]\d{1,2}日?|\d{1,2}[-/.]\d{1,2}[-/.]\d{4}|\d{1,2}[ \u00a0]+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?[ \u00a0]+\d{4}|(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?[ \u00a0]+\d{1,2},?[ \u00a0]+\d{4})([ \u00a0\u3000]+\d{1,2}:\d{2}(:\d{2})?)?)?\s*(\.|$)|^[^\n]{0,60}\((China Radio International|China Plus|(?-i:CRI[ \u00a0]?(Online|ONLINE|English|ENGLISH)))\)\s*(--|—|-|–)'
        strength: strong
        note: 'CRI names itself CRI Online, CRIOnline or CRIONLINE as a release issuer ("A news report from CRIOnline:", issuer CRIONLINE NETWORK (BEIJING) CO LTD on PR Newswire), and CRIENGLISH or CRI English on its former English site. The acronym must be upper case and the next word capitalised, because Italian, Spanish, Portuguese and French text use "cri" and CRI for other things: the Italian Red Cross runs "CRI online" courses, a Mexican listing invites readers to watch "Cri Cri online", Portuguese CRI are inclusion resource centres. China Plus, the brand of the CRI English service, counts only as a credit line or dateline, because "China Plus One" is a common supply chain phrase. Since ruleset 2026.10.1 the CRI names count here only in a credit line ("Source: CRIOnline") or a dateline; in credit form at the opening or the end of the body they are cri_name_head_tail, and in the author field cri_author. Anywhere else in the body they are a mention of CRI: before, "CRI Online" anywhere in the text labelled an article state origin, so a story that quoted an interview with CRI Online was labelled as CRI copy. A mention names a state entity and sends the article to the model through cites_china_media_group. CRI''s English site now serves CGTN Radio, which cgtn_credit reads.'
      - id: cri_name_head_tail
        regex: '(?m)\bCRI[ \u00a0]?(Online|ONLINE|English|ENGLISH)(\.com)?\s*[:：]|^\s*CRI[ \u00a0]?(Online|ONLINE|English|ENGLISH)(\.com)?\s*\.?\s*$|(?i:copyright|©|\(c\))[^\n]{0,30}\bCRI[ \u00a0]?(Online|ONLINE|English|ENGLISH)\b'
        strength: strong
        scope: head_tail
        note: 'Added in ruleset 2026.10.1, from cri_credit. CRI names itself at the top of its releases ("A news report from CRIOnline:", "Laporan berita daripada CRIOnline:") and at the foot of its own pages ("Copyright by CRIENGLISH.com"), so in the first 400 or the last 600 characters of the body the upper case name counts when it introduces the text with a colon, stands alone on a line, or follows a copyright mark. A sentence there that names CRI ("talked with Chinese media CRI English about the trial") is a mention, which cites_china_media_group sends to the model.'
      - id: cri_author
        regex: '(?i)^\s*(China Radio International|China Plus)\s*$|\b(?-i:CRI[ \u00a0]?(Online|ONLINE|English|ENGLISH))\b'
        strength: strong
        scope: author
        note: Added in ruleset 2026.10.1. The author field is a credit position, so a CRI name there labels the article as the credit line does.
      - id: cgtn_spelled_out_credit
        regex: '(?im)^\s*(source|fonte|credit|by)\s*[:：]?\s*China Global Television Network(([ \u00a0\u3000]*[,，|｜/·][ \u00a0\u3000]*|[ \u00a0\u3000]+)(\d{4}[-/.年]\d{1,2}[-/.月]\d{1,2}日?|\d{1,2}[-/.]\d{1,2}[-/.]\d{4}|\d{1,2}[ \u00a0]+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?[ \u00a0]+\d{4}|(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?[ \u00a0]+\d{1,2},?[ \u00a0]+\d{4})([ \u00a0\u3000]+\d{1,2}:\d{2}(:\d{2})?)?)?\s*(\.|$)'
        strength: strong
      - id: xinhua_italian_credit
        regex: '(?im)^\s*\(?\s*(Agenzia\s+)?Xinhua\s*(/|-|–|\)|$)'
        strength: weak
        scope: head
        note: Italian syndication often opens with "Xinhua/" or "(Xinhua) " before the dateline.
      - id: xinhua_writer_byline
        regex: '(?im)^\s*(by|di|par|por)\s+Xinhua\s+(writer|writers|reporter|corrispondente)s?\b'
        strength: strong
        scope: byline_head
        note: 'Must stand where a byline stands. Matched anywhere, it fired on prose citing a Xinhua report inside an outlet piece written by its own reporter.'
      - id: state_outlet_source_label
        regex: '^source: (?:[^\n]*?\s*[;,/|&]\s*|[^\n]*?\s+and\s+)?(?:(?i:(?:the\s+)?(?:(?:(?:Agenzia|Agence|Agencia)\s+)?Xinhua(?:\s+News\s+Agency|\s+Silk\s+Road)?|China\s+Daily(?:\s+Global)?|Global\s+Times|CGTN|China\s+Global\s+Television\s+Network|People''?s\s+Daily(?:\s+Online)?|China\s+News\s+Service|ECNS|ecns\.cn|China\s+Radio\s+International|China\s+Plus|China\s+Media\s+Group))|CRI[ \u00a0]?(?:Online|ONLINE|English|ENGLISH)(?:\.com)?)(?:\s*[;,/|&]\s*[^\n]*|\s+and\s+[^\n]*)?\s*$'
        strength: strong
        scope: labels
        note: 'The source the outlet''s own page data credits the article to, which extract.page_labels writes as a "source: X" line (extract.embedded_source; Seven West Media pages carry it in the "source" field of the article''s own object and nowhere in the body). It is the outlet''s own credit line kept in metadata, so a named writer with source Xinhua is wire copy as much as a desk byline is; desk bylines also reach the author scoped Xinhua signatures through extract.wire_author. The name must be the whole value or one item of a list, in the forms the credit signatures above use, and the line must start with the lower case "source: " that page_labels writes, so a photo credit (a "credit" field, never read) or a "Source:" caption in page chrome cannot fire it. Added in ruleset 2026.10.1.'

      # Native script names of the state outlets, added in ruleset 2026.09.8. Before it the
      # ruleset carried 58 Latin spellings of Xinhua and none in Greek, Hebrew, Persian, Turkish
      # or Vietnamese, against 12 active Greek outlets, 11 Persian and 10 Hebrew, so state origin
      # was structurally undetectable outside Latin script and every comparison between countries
      # was confounded with script. Each name is read only where a credit stands: after a source
      # marker, in the author field, alone on a line at the end of the body, or in a wire
      # dateline. A bare mention in the body is a citation and goes to the model through the
      # llm_triggers below, exactly as the Latin spellings do.
      - id: state_outlet_credit_line_native
        regex: '(?im)^\s*\(?\s*(Πηγή|מקור|منبع|المصدر|Kaynak|Nguồn|Источник|출처|기사출처|出典|提供|配信|来源|來源|稿源)\s*[:：]\s*(Σινχούα|Σινχουά|Σίνχουα|Σινχουα|Ξινχούα|Ξινχουά|Ξίνχουα|Ξινχουα|Πρακτορείο Νέα Κίνα|שינחואה|סינחואה|شین[\u200c ]?هوا|Şinhua Haber Ajansı|Şinhua|Tân Hoa Xã|Tân Hoa xã|Синьхуа|Медиакорпорация Китая|Жэньминь жибао|Хуаньцю шибао|Центральное телевидение Китая|وكالة أنباء الصين الجديدة|شينخوا|شينهوا|신화통신사|신화통신|신화사|인민일보|환구시보|중국중앙방송총국|중국중앙방송|차이나데일리|新華社通信|新華社|チャイナ・デイリー|チャイナデイリー|中国中央テレビ|新华社|新华网|新華網|中国日报|中國日報|环球时报|環球時報|人民日报|人民日報|中国中央电视台|中央电视台|中央广播电视总台|中央廣播電視總台|中国国际电视台|中国新闻社|中新社|中国国际广播电台|中國國際廣播電台|中國國際廣播電臺|国际在线|國際在線|中国国際放送局|중국국제방송국|중국국제방송)(([ \u00a0\u3000]*[,，|｜/·][ \u00a0\u3000]*|[ \u00a0\u3000]+)(\d{4}[-/.年]\d{1,2}[-/.月]\d{1,2}日?|\d{1,2}[-/.]\d{1,2}[-/.]\d{4}|\d{1,2}[ \u00a0]+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?[ \u00a0]+\d{4}|(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?[ \u00a0]+\d{1,2},?[ \u00a0]+\d{4})([ \u00a0\u3000]+\d{1,2}:\d{2}(:\d{2})?)?)?\s*\)?\s*[.。]?\s*$'
        strength: strong
        note: A source marker in the outlet's own language naming a Chinese state outlet as the source of the text. Since ruleset 2026.10.1 also China Radio International in Chinese (中国国际广播电台, 國際在線), Japanese (中国国際放送局) and Korean (중국국제방송), and a trailing date after the name ("来源：国际在线 2026-09-06"); the name must still end the line, so "来源：国际在线教育" does not count.
      - id: state_outlet_author_field_native
        regex: '(?i)^\s*\(?\s*(Σινχούα|Σινχουά|Σίνχουα|Σινχουα|Ξινχούα|Ξινχουά|Ξίνχουα|Ξινχουα|Πρακτορείο Νέα Κίνα|שינחואה|סינחואה|شین[\u200c ]?هوا|Şinhua Haber Ajansı|Şinhua|Tân Hoa Xã|Tân Hoa xã|Синьхуа|Медиакорпорация Китая|Жэньминь жибао|Хуаньцю шибао|Центральное телевидение Китая|وكالة أنباء الصين الجديدة|شينخوا|شينهوا|신화통신사|신화통신|신화사|인민일보|환구시보|중국중앙방송총국|중국중앙방송|차이나데일리|新華社通信|新華社|チャイナ・デイリー|チャイナデイリー|中国中央テレビ|新华社|新华网|新華網|中国日报|中國日報|环球时报|環球時報|人民日报|人民日報|中国中央电视台|中央电视台|中央广播电视总台|中央廣播電視總台|中国国际电视台|中国新闻社|中新社|中国国际广播电台|中國國際廣播電台|中國國際廣播電臺|国际在线|國際在線|中国国際放送局|중국국제방송국|중국국제방송)\s*\)?\s*$'
        strength: strong
        scope: author
        note: The author field holds the state outlet's name and nothing else, the native script form of xinhua_author_field.
      - id: state_outlet_wire_end_native
        regex: '(?m)^(?<![-•·*]\n)(?<![-•·*][ \t]\n)[ \t]*[（(]?[ \t]*(Σινχούα|Σινχουά|Σίνχουα|Σινχουα|Ξινχούα|Ξινχουά|Ξίνχουα|Ξινχουα|Πρακτορείο Νέα Κίνα|שינחואה|סינחואה|شین[\u200c ]?هوا|Şinhua Haber Ajansı|Şinhua|Tân Hoa Xã|Tân Hoa xã|Синьхуа|Медиакорпорация Китая|Жэньминь жибао|Хуаньцю шибао|Центральное телевидение Китая|وكالة أنباء الصين الجديدة|شينخوا|شينهوا|신화통신사|신화통신|신화사|인민일보|환구시보|중국중앙방송총국|중국중앙방송|차이나데일리|新華社通信|新華社|チャイナ・デイリー|チャイナデイリー|中国中央テレビ|新华社|新华网|新華網|中国日报|中國日報|环球时报|環球時報|人民日报|人民日報|中国中央电视台|中央电视台|中央广播电视总台|中央廣播電視總台|中国国际电视台|中国新闻社|中新社|中国国际广播电台|中國國際廣播電台|中國國際廣播電臺|国际在线|國際在線|中国国際放送局|중국국제방송국|중국국제방송)[ \t]*[)）]?[ \t]*$(?=(?:\n[^\n]{0,79})*\Z)'
        strength: strong
        scope: tail
        note: 'The state outlet''s name alone on a line at the end of the body, where a credit sits. The native script form of xinhua_wire_end. Photo and picture credits are removed first by photo_credit_native. From ruleset 2026.10.2 the line must close the body (only lines under 80 characters may follow it, a copyright or photo line) and must not follow a line holding only a list mark: Maeil Business adds an AI glossary under its stories ("-", then "신화통신", then a sentence defining it), and the term line of that glossary had labelled a Maeil report state origin.'
      - id: state_outlet_dateline_native
        regex: '(?m)^[^\n]{0,60}[（(]\s*(Σινχούα|Σινχουά|Σίνχουα|Σινχουα|Ξινχούα|Ξινχουά|Ξίνχουα|Ξινχουα|שינחואה|סינחואה|شین[\u200c ]?هوا|Şinhua|Tân Hoa Xã|Tân Hoa xã|Синьхуа|شينخوا|شينهوا|신화통신|新華社|新华社|中新社)\s*[)）]\s*(--|—|–)|^\s*(新华社|新華社|中新社|中新網|中新网)[^\n]{0,24}(电|電)\b|^\s*【\s*(新華社|新华社)[^\n]{0,24}】|[（(][^\n]{0,20}=\s*(신화통신|신화사)\s*[)）]'
        strength: strong
        note: 'The wire dateline in its native form: "(Синьхуа) --", the Chinese "新华社北京9月12日电", the Japanese "【新華社北京9月12日】" and the Korean "(베이징=신화통신)". The parenthetical form needs the wire dash, not a colon, because prose that gives the acronym after the full name, "وكالة أنباء الصين الجديدة (شينخوا):", is a citation and not a credit.'

  distribution_stamp:
    description: Press release wire stamps whose issuing entity is Chinese state linked, and disclosures that the publisher has not reviewed the content.
    patterns:
      - id: wire_stamp_with_state_entity
        regex: '(?i)\b(Globe ?Newswire|PR ?Newswire|Business ?Wire|ACN Newswire|Cision)\b[^\n]{0,30}?(--|—|–|-)[^\n]{0,150}?\b(Xinhua|Xinhuanet|CGTN|CCTV\+|CCTV\.com|CCTV|China Daily|chinadaily\w*|Global Times|China Media Group|People.s Daily|China International Communication Group|CICG|Xinhua Silk Road|China Economic Net|Publicity Department|Information Office of|Chinese Embassy|Embassy of (the People.s Republic of )?China|China Cultural Cent(er|re)|Confucius Institute Headquarters|Center for Language Education and Cooperation)\b'
        strength: strong
        note: 'The state entity must stand in the release''s own issuer line, on the same line as the wire dateline and inside 150 characters of its dash: "/PRNewswire/ -- A news report from China Daily:". Until ruleset 2026.09.8 the entity could sit anywhere within 3000 characters and across paragraphs, which collapsed the test to "does this outlet mention Chinese state media at all" and carried most of the United States count.'
      - id: state_entity_then_wire_stamp
        regex: '(?im)^\s*\(?\s*(SOURCE|Source|Fonte|Fuente|Quelle|Origine|Источник|المصدر)\s*:?\s+(the\s+)?(Xinhua( Silk Road| News Agency)?|Xinhuanet|CGTN|CCTV\+?|China Daily|Global Times|China Media Group|People.s Daily|CICG|China International Communication Group|China Economic Net|Chinese Embassy|Embassy of (the People.s Republic of )?China|Information Office of [^\n]{0,60})\s*\)?\s*[.]?\s*$'
        strength: strong
        note: 'The release trailer that names its issuer, anchored to a source marker at the start of a line: "SOURCE Global Times", "Fonte: CGTN". Before ruleset 2026.09.8 this pattern only required a state entity somewhere within 3000 characters before a wire stamp, so an outlet''s own story that cited state media qualified.'
      - id: wire_release_headline_issuer
        regex: '(?ims)\A[^\n]{0,12}\b(Xinhua( Silk Road)?|Xinhuanet|CGTN|CCTV\+?|China Daily|Global Times|People.s Daily|China Media Group|CICG|China Economic Net)\b\s*[:：].{0,320}\b(Globe ?Newswire|PR ?Newswire|Business ?Wire|ACN Newswire|Cision)\b'
        strength: strong
        scope: head
        note: 'The release''s own headline names the issuer and the wire dateline follows in the opening, for example "Xinhua Silk Road: Culture ignites vitality" above "BEIJING, Aug. 11, 2026 /PRNewswire/ --". Added in ruleset 2026.09.8 to keep the genuine state issued releases that the narrowed wire_stamp_with_state_entity no longer reaches.'
      - id: immediapress_with_state_entity
        regex: '(?i)[（(]\s*(XINHUA|CGTN|CCTV|China Daily|Global Times)\s*/\s*(ITALPRESS|IMMEDIAPRESS|ADNKRONOS)\s*[)）]|[（(]\s*(ITALPRESS|IMMEDIAPRESS|ADNKRONOS)\s*/\s*(XINHUA|CGTN|CCTV|China Daily|Global Times)\s*[)）]|^\s*\(?\s*(Fonte|Fonte video|Fonte testo)\s*:\s*(Xinhua|CGTN|CCTV|China Daily|Global Times|China Media Group)\b'
        strength: strong
        note: 'The Italian carriers put the originating wire in a slash credit inside the stamp, "(XINHUA/ITALPRESS)", or in a "Fonte:" line. Until ruleset 2026.09.8 the pattern paired the carrier''s own dateline with any state media mention within 3000 characters, so an Italpress report on Xinhua disinformation was labelled state origin, and 231 of Italy''s 242 labels rested on it.'
      - id: wire_stamp_near_state_entity
        regex: '(?is)\b(Globe ?Newswire|PR ?Newswire|Business ?Wire|ACN Newswire|Cision|Immediapress|Adnkronos Immediapress|Italpress)\b.{0,3000}?\b(Xinhua|CGTN|China Daily|Global Times|China Media Group|CCTV|People.s Daily|CICG|China Economic Net|Ambasciata (della Repubblica Popolare )?Cinese|Consolato (Generale )?Cinese|Istituto Confucio)\b'
        strength: hint
        note: 'The old non positional evidence, kept as a hint so these items reach the model instead of being asserted at confidence 1.0. A hint never contributes to a state origin decision by rules; it only routes the article for a judgement.'
      - id: publisher_not_reviewed_disclosure
        regex: '(?i)(has not (reviewed|edited|verified)|is not responsible for|non (è|e) responsabile (del|per il) contenuto|n.est pas responsable du contenu|no es responsable del contenido|não é responsável pelo conteúdo|nicht verantwortlich für den Inhalt|not been edited by|was not involved in the creation)'
        strength: weak
        note: A disclosure that nobody at the publisher formed a view. Weak alone; strong with any state credit.
      - id: wire_stamp_alone
        regex: '(?i)\b(GlobeNewswire|PR Newswire|PRNewswire|Business Wire|BusinessWire|ACN Newswire)\b'
        strength: hint
        note: A press release from anyone, including Chinese companies such as Huawei or vivo, which are not the state. Never counts toward A on its own or in combination; the LLM checks the issuer. Ruleset 2026.09.2 downgraded this from weak after company releases in a partner outlet combined with the outlet's advertorial label to give false A.

  sponsored_placement:
    description: Branded, sponsored and paid placement disclosures, per language. Alone these say only that
      someone paid; with a Chinese state entity they say who. A bare disclosure counts only where one attached
      to this article sits (author field, headline, opening of the body), never in page labels, because those
      carry navigation strips, ad slots and site-wide menu items that name no article.
    patterns:
      - id: sponsored_with_state_entity_en
        regex: '(?is)(?<![\w-])(?P<marker>sponsored (content|by|post|feature|article)|paid (post|content|partnership|for by)|branded content|advertorial|partner content|brought to you by|promoted content|advertisement feature|special report by)\b.{0,600}?\b(China Daily|CGTN|Xinhua|Global Times|China Media Group|CCTV|People.s Daily|Chinese Embassy|Embassy of (the People.s Republic of )?China|Consulate General of (the People.s Republic of )?China|China Cultural Cent(er|re)|Confucius Institute|Hainan|Guangdong|Shandong|Sichuan|Zhejiang|Jiangsu|Fujian|Hubei|Hunan|Yunnan|Chongqing|Tianjin|Shanghai|Beijing)\b.{0,80}?\b(government|province|provincial|municipal|department|bureau|administration|office|committee|council|daily|times|CGTN|Xinhua|embassy|consulate|institute|group|cent(er|re)|People.s Daily)\b'
        strength: strong
        scope: disclosure
        post_check: disclosure_marker
        note: 'From ruleset 2026.10.2 the disclosure (the named group marker) counts only where one attached to this item sits (post_check disclosure_marker): the author field; the item''s own page labels (its meta values and JSON-LD sponsor, funder, articleSection, genre, keywords or creator) anywhere; the headline tag, or a short line of the body''s first 400 or last 600 characters, only when the disclosure opens it; and a line of page chrome (a kicker, ad slot or menu item) only when the state entity is named on that same line. Menu items and ad slots such as "(Anzeige) Solaranlagen", "Kostenlose Onlinespiele (Partnerangebot)", "Contenuto sponsorizzato", "materiał partnera" and a sidebar of "Sponsored Content" links had labelled news state origin whenever a state outlet was named within 600 characters.'
      - id: state_entity_then_sponsored_en
        regex: '(?is)\b(China Daily|CGTN|Xinhua|Global Times|China Media Group|CCTV|People.s Daily|Chinese Embassy|Embassy of (the People.s Republic of )?China)\b.{0,600}?(?<![\w-])(?P<marker>sponsored (content|by|post|feature)|paid (post|content|partnership|for by)|branded content|advertorial|partner content|brought to you by|promoted content)\b'
        strength: strong
        scope: disclosure
        post_check: disclosure_marker
        note: 'From ruleset 2026.10.2 the disclosure (the named group marker) counts only where one attached to this item sits (post_check disclosure_marker): the author field; the item''s own page labels (its meta values and JSON-LD sponsor, funder, articleSection, genre, keywords or creator) anywhere; the headline tag, or a short line of the body''s first 400 or last 600 characters, only when the disclosure opens it; and a line of page chrome (a kicker, ad slot or menu item) only when the state entity is named on that same line. Menu items and ad slots such as "(Anzeige) Solaranlagen", "Kostenlose Onlinespiele (Partnerangebot)", "Contenuto sponsorizzato", "materiał partnera" and a sidebar of "Sponsored Content" links had labelled news state origin whenever a state outlet was named within 600 characters.'
      - id: china_watch_supplement
        regex: '(?i)\bChina Watch\b.{0,200}\b(China Daily|supplement|paid|sponsored|advertising)\b|\b(China Daily)\b.{0,200}\bChina Watch\b'
        strength: strong
        scope: labels_head_tail
        note: The China Watch supplement is a China Daily paid insert.
      - id: sponsored_en
        regex: '(?i)\b(sponsored (content|post|feature|article)|paid (post|content|partnership)|branded content|advertorial|partner content|promoted content|advertisement feature|native advertising)\b'
        strength: weak
        scope: byline_head
      - id: sponsored_it
        regex: '(?i)\b(contenuto sponsorizzato|contenuto a pagamento|publiredazionale|pubbliredazionale|branded content|messaggio promozionale|informazione pubblicitaria|contenuto promozionale|native adv|sponsorizzato da)\b'
        strength: weak
        scope: byline_head
      - id: sponsored_it_with_state_entity
        regex: '(?is)\b(?P<marker>contenuto sponsorizzato|publiredazionale|pubbliredazionale|branded content|informazione pubblicitaria|contenuto promozionale|sponsorizzato da|realizzato da)\b.{0,600}?\b(China Daily|CGTN|Xinhua|Global Times|China Media Group|CCTV|Ambasciata (della Repubblica Popolare )?Cinese|Ambasciata della Cina|Consolato (Generale )?Cinese|Consolato della Cina|Istituto Confucio|Centro Culturale Cinese|Ufficio (Informazioni|Turistico) (della|del) Cina|Governo (Popolare )?(Provinciale|Municipale)|Provincia (dello|del|di) (Shandong|Hainan|Sichuan|Zhejiang|Jiangsu|Fujian|Guangdong|Hubei|Hunan|Yunnan|Henan|Anhui|Shaanxi|Shanxi|Hebei))\b'
        strength: strong
        scope: disclosure
        post_check: disclosure_marker
        note: 'From ruleset 2026.10.2 the disclosure (the named group marker) counts only where one attached to this item sits (post_check disclosure_marker): the author field; the item''s own page labels (its meta values and JSON-LD sponsor, funder, articleSection, genre, keywords or creator) anywhere; the headline tag, or a short line of the body''s first 400 or last 600 characters, only when the disclosure opens it; and a line of page chrome (a kicker, ad slot or menu item) only when the state entity is named on that same line. Menu items and ad slots such as "(Anzeige) Solaranlagen", "Kostenlose Onlinespiele (Partnerangebot)", "Contenuto sponsorizzato", "materiał partnera" and a sidebar of "Sponsored Content" links had labelled news state origin whenever a state outlet was named within 600 characters.'
      - id: cairorcs_studio
        regex: '(?i)\b(CairoRcs Studio|Cairo Rcs Studio|RCS Studio|Studio Rcs|Corriere Innovazione Studio|Rcs MediaGroup Studio|Rcs Studio)\b'
        strength: weak
        scope: labels_head_tail
        note: In-house branded content studio of Corriere della Sera and Gazzetta. Weak because the studio also produces content for non-state clients.
      - id: cairorcs_with_state_entity
        regex: '(?is)\b(CairoRcs Studio|Cairo Rcs Studio|RCS Studio|Studio Rcs)\b.{0,1200}?\b(China Daily|CGTN|Xinhua|Global Times|China Media Group|CCTV|Ambasciata (della Repubblica Popolare )?Cinese|Consolato (Generale )?Cinese|Istituto Confucio|Centro Culturale Cinese|Governo (Popolare )?(Provinciale|Municipale)|Repubblica Popolare Cinese|Provincia (dello|del|di) )'
        strength: strong
        scope: labels_head_tail
      - id: sponsored_fr
        regex: '(?i)\b(contenu sponsorisé|contenu partenaire|contenu de marque|contenu commandité|publireportage|publi-reportage|article sponsorisé|contenu payant)\b'
        strength: weak
        scope: byline_head
      - id: sponsored_fr_with_state_entity
        regex: "(?is)\\b(?P<marker>contenu sponsorisé|contenu partenaire|publireportage|publi-reportage|article sponsorisé|contenu commandité)\\b.{0,600}?\\b(China Daily|CGTN|Xinhua|Global Times|China Media Group|CCTV|Quotidien du Peuple|ambassade de (la République populaire de )?Chine|consulat (général )?de Chine|Institut Confucius|Centre culturel (de )?Chin(e|ois)|gouvernement (populaire )?(provincial|municipal)|province d[eu] )"
        strength: strong
        scope: disclosure
        post_check: disclosure_marker
        note: 'From ruleset 2026.10.2 the disclosure (the named group marker) counts only where one attached to this item sits (post_check disclosure_marker): the author field; the item''s own page labels (its meta values and JSON-LD sponsor, funder, articleSection, genre, keywords or creator) anywhere; the headline tag, or a short line of the body''s first 400 or last 600 characters, only when the disclosure opens it; and a line of page chrome (a kicker, ad slot or menu item) only when the state entity is named on that same line. Menu items and ad slots such as "(Anzeige) Solaranlagen", "Kostenlose Onlinespiele (Partnerangebot)", "Contenuto sponsorizzato", "materiał partnera" and a sidebar of "Sponsored Content" links had labelled news state origin whenever a state outlet was named within 600 characters.'
      - id: sponsored_es
        regex: '(?i)\b(publirreportaje|publi-reportaje|contenido patrocinado|contenido de marca|branded content|patrocinado por|contenido pagado|contenido promocionado|espacio patrocinado)\b'
        strength: weak
        scope: byline_head
      - id: sponsored_es_with_state_entity
        regex: '(?is)\b(?P<marker>publirreportaje|contenido patrocinado|contenido de marca|patrocinado por|contenido pagado)\b.{0,600}?\b(China Daily|CGTN|Xinhua|Global Times|China Media Group|CCTV|Diario del Pueblo|embajada de (la República Popular )?China|consulado (general )?de China|Instituto Confucio|Centro Cultural (de )?China|gobierno (popular )?(provincial|municipal)|provincia de )'
        strength: strong
