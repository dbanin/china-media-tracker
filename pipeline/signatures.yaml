  authored_by_state:
    description: Signed pieces by Chinese ambassadors, consuls general, embassy spokespersons and Ministry of Foreign Affairs officials. Matched on the author field and on the biographical line that opens or closes the piece, never on the body, because "the Chinese ambassador said" is ordinary reporting.
    patterns:
      - id: diplomat_title_author_field
        regex: "(?i)(\\b(ambassador|ambassadeur|ambasciatore|ambasciatrice|embajador|embajadora|embaixador|embaixadora|botschafter|botschafterin|consul[- ]general|console generale|consul général|cónsul general|cônsul-geral|generalkonsul|chargé d.affaires|charge d.affaires|incaricato d.affari|spokesperson|portavoce|porte-parole|portavoz|counsellor|counselor|minister counsellor)\\b.{0,80}\\b(China|Chine|Cina|Chinese|chinois|cinese|chino|chinesa|chinês|chinesisch|People.s Republic|République populaire|Repubblica Popolare|República Popular|Volksrepublik|PRC)\\b|\\b(China|Chine|Cina|Chinese|chinois|cinese|chino|chinesa|chinês|chinesisch|People.s Republic|République populaire|Repubblica Popolare|República Popular|Volksrepublik|PRC)\\b.{0,80}\\b(ambassador|ambassadeur|ambasciatore|ambasciatrice|embajador|embajadora|embaixador|embaixadora|botschafter|botschafterin|consul[- ]general|console generale|consul général|cónsul general|cônsul-geral|generalkonsul|chargé d.affaires|charge d.affaires|incaricato d.affari|spokesperson|portavoce|porte-parole|portavoz|counsellor|counselor|minister counsellor)\\b)"
        strength: strong
        scope: author
      - id: diplomat_title_head
        regex: "(?i)\\b(ambassador|ambassadeur|ambasciatore|ambasciatrice|embajador|embajadora|embaixador|botschafter|consul[- ]general|console generale|consul général|cónsul general|chargé d.affaires|incaricato d.affari)\\b\\s+(of|de|della|del|di|da|der|des|du)\\s+(the\\s+)?(People.s Republic of China|Repubblica Popolare Cinese|République populaire de Chine|República Popular (de )?China|Volksrepublik China|China|Chine|Cina)\\s+(to|in|en|au|auprès|presso|bei|em|à)\\b"
        strength: weak
        scope: head
        note: Opening attribution such as "Ambassador of the People's Republic of China to Italy". Weak since 2026.09.2, because a news report that opens by naming the ambassador matches the same words; the LLM decides.
      - id: diplomat_byline_head
        regex: "(?im)^\\s*(by|par|di|por|von|door|av|de)\\s+[^\\n,]{3,60},\\s*(H\\.E\\.\\s*)?(the\\s+)?(ambassador|ambassadeur|ambasciatore|ambasciatrice|embajador|embajadora|embaixador|botschafter|consul[- ]general|console generale|consul général|cónsul general|chargé d.affaires)\\b[^\\n]{0,80}\\b(China|Chine|Cina|Chinese|chinois|cinese|chino|chinesa|chinês|People.s Republic|République populaire|Repubblica Popolare|República Popular|Volksrepublik|PRC)\\b"
        strength: strong
        scope: head
        note: Explicit byline form "By Xiao Qian, Ambassador of the People's Republic of China to Australia" at the top of the piece.
      - id: diplomat_title_tail
        regex: "(?i)\\b(is|is the|was|est|è|es|é|ist|serves as|is China.s|is the Chinese)\\s+(the\\s+)?(Chinese\\s+|China.s\\s+)?(ambassador|ambassadeur|ambasciatore|ambasciatrice|embajador|embajadora|embaixador|botschafter|consul[- ]general|console generale|consul général|cónsul general|chargé d.affaires|incaricato d.affari)\\b.{0,80}\\b(China|Chine|Cina|Chinese|People.s Republic|Repubblica Popolare|République populaire|República Popular|Volksrepublik|PRC|to Australia|to Canada|in Italia|au Canada)\\b"
        strength: weak
        scope: tail
        note: Closing biographical line, for example "Xiao Qian is the ambassador of the People's Republic of China to Australia." Weak since 2026.09.2 because the same sentence occurs in reporting; the LLM decides.
      - id: embassy_byline
        regex: "(?i)^\\s*(the\\s+)?(Chinese Embassy|Embassy of (the People.s Republic of )?China|Ambasciata (della Repubblica Popolare )?Cinese|Ambassade de (la République populaire de )?Chine|Embajada de (la República Popular )?China|Embaixada da (República Popular da )?China|Botschaft der Volksrepublik China|Chinese Consulate|Consulate General of (the People.s Republic of )?China|Ministry of Foreign Affairs of (the People.s Republic of )?China|Chinese Ministry of Foreign Affairs)\\b"
        strength: strong
        scope: author
      - id: mofa_official_head
        regex: "(?i)\\b(Ministry of Foreign Affairs of the People.s Republic of China|Chinese Foreign Ministry|Ministero degli Esteri cinese|ministère chinois des Affaires étrangères)\\b.{0,60}\\b(spokesperson|spokesman|spokeswoman|portavoce|porte-parole|portavoz|vice minister|deputy minister|director[- ]general)\\b"
        strength: strong
        scope: author

# Official sourcing triggers. These do not give Category A. An article that is not A
# but matches any of these is routed to the LLM for the B versus C judgement.
llm_triggers:
  - id: cites_xinhua
    regex: '(?i)\bXinhua\b|\bXinhuanet\b|\bNuova Cina\b|\bSinhua\b|\bŞinhua\b|Синьхуа|شينخوا|شينهوا|شین[\u200c ]?هوا|وكالة أنباء الصين الجديدة|新華社|新华社|新华网|新華網|신화통신|신화사|Tân Hoa Xã|Tân Hoa xã|ซินหัว|शिन्हुआ|Σινχούα|Σινχουά|Σίνχουα|Σινχουα|Ξινχούα|Ξινχουά|Ξίνχουα|Ξινχουα|שינחואה|סינחואה|中新社|中国新闻社'
    note: Native script spellings were added in ruleset 2026.09.8. A citation routes the article to the model; it never decides state origin by itself.
  - id: cites_cgtn
    regex: '(?i)\bCGTN\b|China Global Television Network|中国国际电视台'
  - id: cites_global_times
    regex: '(?i)\bGlobal Times\b|Хуаньцю|环球时报|環球時報|환구시보'
  - id: cites_china_daily
    regex: '(?i)\bChina Daily\b|中国日报|中國日報|차이나데일리|チャイナ・デイリー|チャイナデイリー'
  - id: cites_cctv
    regex: '(?i)\b(state|state-run|state-owned|official|Chinese|China.s|Beijing.s|broadcaster|television|televisi[oó]n|televis[aã]o|t[eé]l[eé]vision|cha[îi]ne|cadena|canal|emissora|emittente|tv|Fernsehsender|staatlich\w*|estatal|statale|chin[oa]|chinesa|chinês|cinese|chinois[e]?|d.[ÉE]tat|телеканал|телевидение|государственн\w*|китайск\w*)\b[^.\n]{0,60}\bCCTV\b|\bCCTV\b[^.\n]{0,60}\b(reported|reports|said|says|quoted|cited|announced|broadcast|aired|showed|state|broadcaster|television|inform[oó]u?|señal[oó]|report[oó]|disse|berichtete|meldete|a (indiqué|rapporté|annoncé)|ha (riferito|riportato)|сообщ\w*)\b|China Central Television|Televisione Centrale Cinese|télévision centrale chinoise|Televisión Central de China|Центральное телевидение Китая|中央电视台|中国中央电视台|中国中央テレビ|중국중앙방송'
    note: CCTV also means closed-circuit television. The acronym counts only with broadcaster or China context in the same sentence on either side; "Detectives have reviewed CCTV and identified" does not fire.
  - id: cites_peoples_daily
    regex: "(?i)\\bPeople'?s Daily\\b|Quotidiano del Popolo|Quotidien du Peuple|Diario del Pueblo|Diário do Povo|Volkszeitung|Жэньминь жибао|人民日报|人民日報|인민일보"
  - id: cites_china_media_group
