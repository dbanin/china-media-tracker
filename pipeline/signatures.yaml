# Deterministic signature patterns for Category A detection and for routing to the
# LLM. Every match records the pattern id so any Category A count can be broken
# down by mechanism.
#
# Fields per pattern:
#   id        stable identifier, never reuse after removal
#   regex     Python regex, applied with re.MULTILINE and re.UNICODE. Use (?i) for
#             case insensitive patterns; credit lines are usually case sensitive.
#   strength  strong  = one match alone gives Category A with confidence 1.0
#             weak    = needs a second weak match from a different group, otherwise
#                       the article is routed to the LLM as an A candidate
#             hint    = never contributes to a Category A decision; only routes the
#                       article to the LLM as an A candidate. Used for markers that
#                       identify a distribution channel without saying who issued it.
#   scope     author  = the article's author field only
#             head    = first 400 characters of the body
#             tail    = last 600 characters of the body
#             body    = whole body (default)
#             any     = author, title and body
#   note      why this pattern exists
#
# Decision rule (classify_rules.py): any strong match, or weak matches from two
# different groups, gives Category A with confidence 1.0 and no LLM call. One
# weak match routes to the LLM as an A candidate. Exclusions are applied first
# and remove the matched span from the text before patterns run.
ruleset_version: "2026.09.8"

# Spans removed before matching, so a photo credit is not read as a text credit.
exclusions:
  - id: photo_credit
    regex: '(?i)\b(photo|foto|image|immagine|picture|pic|fotografía|photographie|bild|credit|crédit|crediti)\s*(credit|by|di|de|par|:)?\s*[:/]?\s*(Xinhua|CGTN|China Daily|Global Times|VCG|Imaginechina)[^\n.]{0,40}'
  - id: photo_paren
    regex: '\((?:Photo|Foto|Image|Immagine|Pic)[^)]{0,40}(?:Xinhua|CGTN|VCG)[^)]{0,40}\)'
  - id: photo_credit_native
    regex: '(?i)(사진|寫真|写真|图片|圖片|照片|Φωτογραφία|Φωτο|צילום|תצלום|عکس|تصویر|صورة|الصورة|Ảnh|Fotoğraf)\s*[=:：／/]?\s*[（(]?\s*(Σινχούα|Σινχουά|Σίνχουα|Σινχουα|Ξινχούα|Ξινχουά|Ξίνχουα|Ξινχουα|שינחואה|סינחואה|شین[\u200c ]?هوا|Şinhua|Tân Hoa Xã|Tân Hoa xã|Синьхуа|شينخوا|شينهوا|신화통신|신화사|新華社|新华社|中新社|中国日报|中國日報)\s*[)）]?'
    note: The native script counterpart of photo_credit. A picture credit is not a text credit, and it has to be removed before the native credit patterns read a name standing alone on a line.
  - id: xinhua_via_ap_photo
    regex: '(?i)Xinhua via (AP|Getty|Reuters)[^\n.]{0,40}'
  - id: syndication_disclaimer
    regex: '(?i)\(?(except for the headline,?\s*)?this (article|story|report|content) (has|was) (not been edited|been published|auto-?generated|not been modified)[^\n)]{0,160}\)?|\(?this (story|article) (has been|is) (published|generated) (from|by) a (wire|syndicated|third[- ]party) (agency )?feed[^\n)]{0,120}\)?|disclaimer: this (article|story|content)[^\n]{0,160}'
    note: Indian and other syndication boilerplate ("Except for the headline, this article has not been edited by ...") names a wire agency, not a sponsor. Removed before the sponsored placement patterns run.

groups:
  credit_dateline:
    description: Wire credit lines and datelines showing the text came from a Chinese state outlet.
    patterns:
      - id: xinhua_dateline
        regex: '(?m)^[^\n]{0,60}\(Xinhua\)'
        strength: strong
        note: Classic wire dateline, for example "BEIJING, Sept. 2 (Xinhua) -- ".
      - id: xinhua_paren_inline
        regex: '\(Xinhua\)\s*(--|—|-|–)'
        strength: strong
        note: Dateline form with the wire dash, even when not at line start.
      - id: xinhua_slash_credit
        regex: '(?im)^[^\n]{0,80}\(\s*XINHUA\s*(/\s*[A-Z][A-Za-z]+)?\s*\)\s*(--|—|-|–)'
        strength: strong
        note: Italian agency syndication form "PECHINO (CINA) (XINHUA/ITALPRESS) –".
      - id: source_xinhua
        regex: '(?m)^\s*SOURCE:?\s+Xinhua(\s+Silk\s+Road)?(\s+News\s+Agency)?\s*$'
        strength: strong
        note: Release wire trailer "SOURCE Xinhua" or "SOURCE Xinhua Silk Road".
      - id: xinhua_credit_line
        regex: '(?im)^\s*(source|fonte|credit|crediti|quelle|fuente|origine|por|by|di|par|von|editing by|editor)\s*:?\s*(the\s+)?Xinhua(\s+News\s+Agency)?\s*(\.|$)'
        strength: strong
        note: Explicit credit line naming Xinhua as the source of the text.
      - id: xinhua_co_credit_author
        regex: '(?i)(^|[;,/|]|\band\b)\s*(Agenzia\s+)?Xinhua(\s+News\s+Agency)?\s*$'
        strength: strong
        scope: author
        note: 'A co-credited byline, for example Antaranews Com followed by Xinhua. The wire is named as an author of the text, not cited in it.'
      - id: xinhua_translator_credit
        regex: '(?im)^\s*(penerjemah|penterjemah|sumber|fonte|source|traduzione)\s*:\s*(agenzia\s+)?Xinhua\b'
        strength: strong
        scope: tail
        note: 'Trailer on republished wire copy, for example Antara translator credits naming Xinhua.'
      - id: xinhua_author_field
        regex: '(?i)^\s*(Xinhua|Xinhua News Agency|Agenzia Xinhua|Agence Xinhua|Agencia Xinhua)\s*$'
        strength: strong
        scope: author
      - id: xinhua_wire_end
        regex: '(?im)^\s*\(?\s*(Xinhua|Xinhua News Agency)\s*\)?\s*$'
        strength: strong
        scope: tail
        note: A bare "Xinhua" on its own line at the end of the article is a wire credit.
      - id: china_daily_credit
        regex: '(?im)^\s*(source|fonte|credit|crediti|quelle|fuente|by|di|par|von)\s*:?\s*(the\s+)?China\s+Daily\s*(\.|$)|^[^\n]{0,60}\(China Daily\)\s*(--|—|-|–)'
        strength: strong
      - id: china_daily_author
        regex: '(?i)^\s*China\s+Daily(\s+Global)?\s*$'
        strength: strong
        scope: author
      - id: global_times_credit
        regex: '(?im)^\s*(source|fonte|credit|crediti|quelle|fuente|by|di|par|von)\s*:?\s*(the\s+)?Global\s+Times\s*(\.|$)|^[^\n]{0,60}\(Global Times\)\s*(--|—|-|–)'
        strength: strong
      - id: global_times_author
        regex: '(?i)^\s*Global\s+Times\s*$'
        strength: strong
        scope: author
      - id: cgtn_credit
        regex: '(?im)^\s*(source|fonte|credit|crediti|quelle|fuente|by|di|par|von)\s*:?\s*CGTN\s*(\.|$)|^[^\n]{0,60}\(CGTN\)\s*(--|—|-|–)'
        strength: strong
        note: The parenthetical form must be a dateline ("BEIJING (CGTN) --"), because prose that expands the acronym, "China Global Television Network (CGTN) released", is a report about CGTN and not CGTN copy.
      - id: cgtn_bare_line_tail
        regex: '(?m)^\s*CGTN\s*$'
        strength: strong
        scope: tail
        note: A bare "CGTN" line counts only at the end of the body, where a credit sits. In the middle of a body it is a section heading, as in an Indian Express explainer that surveys Chinese outlets under headings "Xinhua", "CGTN", "Global Times".
      - id: cgtn_author
        regex: '(?i)^\s*(CGTN|China Global Television Network)\s*$'
        strength: strong
        scope: author
      - id: china_media_group_credit
        regex: '(?im)\bChina Media Group\b.{0,40}\b(release|press release|comunicato|communiqué)|^\s*(source|fonte)\s*:?\s*China Media Group\s*$'
        strength: strong
        note: 'The name must be spelled out. Ruleset 2026.09.8 dropped the bare acronym: CMG is the Toronto ticker of Computer Modelling Group Ltd, whose annual meeting releases carry "press release" within a few words of it, and the Canadian count was 19 percent company filings.'
      - id: peoples_daily_credit
        regex: "(?im)^\\s*(source|fonte|credit|crediti|by|di|par)\\s*:?\\s*(the\\s+)?People'?s\\s+Daily(\\s+Online)?\\s*(\\.|$)|^[^\\n]{0,60}\\(People'?s Daily\\)\\s*(--|—|-|–)"
        strength: strong
      - id: peoples_daily_author
        regex: "(?i)^\\s*People'?s\\s+Daily(\\s+Online)?\\s*$"
        strength: strong
        scope: author
      - id: china_news_service_credit
        regex: '(?im)^\s*(source|fonte|credit|by|di)\s*:?\s*(China News Service|ECNS|ecns\.cn)\s*(\.|$)|^[^\n]{0,60}\((China News Service|ECNS)\)\s*(--|—|-|–)'
        strength: strong
      - id: cri_credit
        regex: '(?im)^\s*(source|fonte|credit|by|di)\s*:?\s*China Radio International\s*(\.|$)|^[^\n]{0,60}\(China Radio International\)\s*(--|—|-|–)|\bCRI Online\b'
        strength: strong
      - id: cgtn_spelled_out_credit
        regex: '(?im)^\s*(source|fonte|credit|by)\s*:?\s*China Global Television Network\s*(\.|$)'
        strength: strong
      - id: xinhua_italian_credit
        regex: '(?im)^\s*\(?\s*(Agenzia\s+)?Xinhua\s*(/|-|–|\)|$)'
        strength: weak
        scope: head
        note: Italian syndication often opens with "Xinhua/" or "(Xinhua) " before the dateline.
      - id: xinhua_writer_byline
        regex: '(?im)^\s*(by|di|par|por)\s+Xinhua\s+(writer|writers|reporter|corrispondente)s?\b'
        strength: strong
        scope: byline_head
        note: 'Must stand where a byline stands. Matched anywhere, it fired on prose citing a Xinhua report inside an outlet piece written by its own reporter.'

      # Native script names of the state outlets, added in ruleset 2026.09.8. Before it the
      # ruleset carried 58 Latin spellings of Xinhua and none in Greek, Hebrew, Persian, Turkish
      # or Vietnamese, against 12 active Greek outlets, 11 Persian and 10 Hebrew, so state origin
      # was structurally undetectable outside Latin script and every comparison between countries
      # was confounded with script. Each name is read only where a credit stands: after a source
      # marker, in the author field, alone on a line at the end of the body, or in a wire
      # dateline. A bare mention in the body is a citation and goes to the model through the
      # llm_triggers below, exactly as the Latin spellings do.
      - id: state_outlet_credit_line_native
        regex: '(?im)^\s*\(?\s*(Πηγή|מקור|منبع|المصدر|Kaynak|Nguồn|Источник|출처|기사출처|出典|提供|配信|来源|來源|稿源)\s*[:：]\s*(Σινχούα|Σινχουά|Σίνχουα|Σινχουα|Ξινχούα|Ξινχουά|Ξίνχουα|Ξινχουα|Πρακτορείο Νέα Κίνα|שינחואה|סינחואה|شین[\u200c ]?هوا|Şinhua Haber Ajansı|Şinhua|Tân Hoa Xã|Tân Hoa xã|Синьхуа|Медиакорпорация Китая|Жэньминь жибао|Хуаньцю шибао|Центральное телевидение Китая|وكالة أنباء الصين الجديدة|شينخوا|شينهوا|신화통신사|신화통신|신화사|인민일보|환구시보|중국중앙방송총국|중국중앙방송|차이나데일리|新華社通信|新華社|チャイナ・デイリー|チャイナデイリー|中国中央テレビ|新华社|新华网|新華網|中国日报|中國日報|环球时报|環球時報|人民日报|人民日報|中国中央电视台|中央电视台|中央广播电视总台|中央廣播電視總台|中国国际电视台|中国新闻社|中新社)\s*\)?\s*[.。]?\s*$'
        strength: strong
        note: A source marker in the outlet's own language naming a Chinese state outlet as the source of the text.
      - id: state_outlet_author_field_native
        regex: '(?i)^\s*\(?\s*(Σινχούα|Σινχουά|Σίνχουα|Σινχουα|Ξινχούα|Ξινχουά|Ξίνχουα|Ξινχουα|Πρακτορείο Νέα Κίνα|שינחואה|סינחואה|شین[\u200c ]?هوا|Şinhua Haber Ajansı|Şinhua|Tân Hoa Xã|Tân Hoa xã|Синьхуа|Медиакорпорация Китая|Жэньминь жибао|Хуаньцю шибао|Центральное телевидение Китая|وكالة أنباء الصين الجديدة|شينخوا|شينهوا|신화통신사|신화통신|신화사|인민일보|환구시보|중국중앙방송총국|중국중앙방송|차이나데일리|新華社通信|新華社|チャイナ・デイリー|チャイナデイリー|中国中央テレビ|新华社|新华网|新華網|中国日报|中國日報|环球时报|環球時報|人民日报|人民日報|中国中央电视台|中央电视台|中央广播电视总台|中央廣播電視總台|中国国际电视台|中国新闻社|中新社)\s*\)?\s*$'
        strength: strong
        scope: author
        note: The author field holds the state outlet's name and nothing else, the native script form of xinhua_author_field.
      - id: state_outlet_wire_end_native
        regex: '(?m)^\s*[（(]?\s*(Σινχούα|Σινχουά|Σίνχουα|Σινχουα|Ξινχούα|Ξινχουά|Ξίνχουα|Ξινχουα|Πρακτορείο Νέα Κίνα|שינחואה|סינחואה|شین[\u200c ]?هوا|Şinhua Haber Ajansı|Şinhua|Tân Hoa Xã|Tân Hoa xã|Синьхуа|Медиакорпорация Китая|Жэньминь жибао|Хуаньцю шибао|Центральное телевидение Китая|وكالة أنباء الصين الجديدة|شينخوا|شينهوا|신화통신사|신화통신|신화사|인민일보|환구시보|중국중앙방송총국|중국중앙방송|차이나데일리|新華社通信|新華社|チャイナ・デイリー|チャイナデイリー|中国中央テレビ|新华社|新华网|新華網|中国日报|中國日報|环球时报|環球時報|人民日报|人民日報|中国中央电视台|中央电视台|中央广播电视总台|中央廣播電視總台|中国国际电视台|中国新闻社|中新社)\s*[)）]?\s*$'
        strength: strong
        scope: tail
        note: The state outlet's name alone on a line at the end of the body, where a credit sits. The native script form of xinhua_wire_end. Photo and picture credits are removed first by photo_credit_native.
      - id: state_outlet_dateline_native
        regex: '(?m)^[^\n]{0,60}[（(]\s*(Σινχούα|Σινχουά|Σίνχουα|Σινχουα|Ξινχούα|Ξινχουά|Ξίνχουα|Ξινχουα|שינחואה|סינחואה|شین[\u200c ]?هوا|Şinhua|Tân Hoa Xã|Tân Hoa xã|Синьхуа|شينخوا|شينهوا|신화통신|新華社|新华社|中新社)\s*[)）]\s*(--|—|–)|^\s*(新华社|新華社|中新社|中新網|中新网)[^\n]{0,24}(电|電)\b|^\s*【\s*(新華社|新华社)[^\n]{0,24}】|[（(][^\n]{0,20}=\s*(신화통신|신화사)\s*[)）]'
        strength: strong
        note: 'The wire dateline in its native form: "(Синьхуа) --", the Chinese "新华社北京9月12日电", the Japanese "【新華社北京9月12日】" and the Korean "(베이징=신화통신)". The parenthetical form needs the wire dash, not a colon, because prose that gives the acronym after the full name, "وكالة أنباء الصين الجديدة (شينخوا):", is a citation and not a credit.'

  distribution_stamp:
    description: Press release wire stamps whose issuing entity is Chinese state linked, and disclosures that the publisher has not reviewed the content.
    patterns:
      - id: wire_stamp_with_state_entity
        regex: '(?i)\b(Globe ?Newswire|PR ?Newswire|Business ?Wire|ACN Newswire|Cision)\b[^\n]{0,30}?(--|—|–|-)[^\n]{0,150}?\b(Xinhua|Xinhuanet|CGTN|CCTV\+|CCTV\.com|CCTV|China Daily|chinadaily\w*|Global Times|China Media Group|People.s Daily|China International Communication Group|CICG|Xinhua Silk Road|China Economic Net|Publicity Department|Information Office of|Chinese Embassy|Embassy of (the People.s Republic of )?China|China Cultural Cent(er|re)|Confucius Institute Headquarters|Center for Language Education and Cooperation)\b'
        strength: strong
        note: 'The state entity must stand in the release''s own issuer line, on the same line as the wire dateline and inside 150 characters of its dash: "/PRNewswire/ -- A news report from China Daily:". Until ruleset 2026.09.8 the entity could sit anywhere within 3000 characters and across paragraphs, which collapsed the test to "does this outlet mention Chinese state media at all" and carried most of the United States count.'
      - id: state_entity_then_wire_stamp
        regex: '(?im)^\s*\(?\s*(SOURCE|Source|Fonte|Fuente|Quelle|Origine|Источник|المصدر)\s*:?\s+(the\s+)?(Xinhua( Silk Road| News Agency)?|Xinhuanet|CGTN|CCTV\+?|China Daily|Global Times|China Media Group|People.s Daily|CICG|China International Communication Group|China Economic Net|Chinese Embassy|Embassy of (the People.s Republic of )?China|Information Office of [^\n]{0,60})\s*\)?\s*[.]?\s*$'
        strength: strong
        note: 'The release trailer that names its issuer, anchored to a source marker at the start of a line: "SOURCE Global Times", "Fonte: CGTN". Before ruleset 2026.09.8 this pattern only required a state entity somewhere within 3000 characters before a wire stamp, so an outlet''s own story that cited state media qualified.'
      - id: wire_release_headline_issuer
        regex: '(?ims)\A[^\n]{0,12}\b(Xinhua( Silk Road)?|Xinhuanet|CGTN|CCTV\+?|China Daily|Global Times|People.s Daily|China Media Group|CICG|China Economic Net)\b\s*[:：].{0,320}\b(Globe ?Newswire|PR ?Newswire|Business ?Wire|ACN Newswire|Cision)\b'
        strength: strong
        scope: head
        note: 'The release''s own headline names the issuer and the wire dateline follows in the opening, for example "Xinhua Silk Road: Culture ignites vitality" above "BEIJING, Aug. 11, 2026 /PRNewswire/ --". Added in ruleset 2026.09.8 to keep the genuine state issued releases that the narrowed wire_stamp_with_state_entity no longer reaches.'
      - id: immediapress_with_state_entity
        regex: '(?i)[（(]\s*(XINHUA|CGTN|CCTV|China Daily|Global Times)\s*/\s*(ITALPRESS|IMMEDIAPRESS|ADNKRONOS)\s*[)）]|[（(]\s*(ITALPRESS|IMMEDIAPRESS|ADNKRONOS)\s*/\s*(XINHUA|CGTN|CCTV|China Daily|Global Times)\s*[)）]|^\s*\(?\s*(Fonte|Fonte video|Fonte testo)\s*:\s*(Xinhua|CGTN|CCTV|China Daily|Global Times|China Media Group)\b'
        strength: strong
        note: 'The Italian carriers put the originating wire in a slash credit inside the stamp, "(XINHUA/ITALPRESS)", or in a "Fonte:" line. Until ruleset 2026.09.8 the pattern paired the carrier''s own dateline with any state media mention within 3000 characters, so an Italpress report on Xinhua disinformation was labelled state origin, and 231 of Italy''s 242 labels rested on it.'
      - id: wire_stamp_near_state_entity
        regex: '(?is)\b(Globe ?Newswire|PR ?Newswire|Business ?Wire|ACN Newswire|Cision|Immediapress|Adnkronos Immediapress|Italpress)\b.{0,3000}?\b(Xinhua|CGTN|China Daily|Global Times|China Media Group|CCTV|People.s Daily|CICG|China Economic Net|Ambasciata (della Repubblica Popolare )?Cinese|Consolato (Generale )?Cinese|Istituto Confucio)\b'
        strength: hint
        note: 'The old non positional evidence, kept as a hint so these items reach the model instead of being asserted at confidence 1.0. A hint never contributes to a state origin decision by rules; it only routes the article for a judgement.'
      - id: publisher_not_reviewed_disclosure
        regex: '(?i)(has not (reviewed|edited|verified)|is not responsible for|non (è|e) responsabile (del|per il) contenuto|n.est pas responsable du contenu|no es responsable del contenido|não é responsável pelo conteúdo|nicht verantwortlich für den Inhalt|not been edited by|was not involved in the creation)'
        strength: weak
        note: A disclosure that nobody at the publisher formed a view. Weak alone; strong with any state credit.
      - id: wire_stamp_alone
        regex: '(?i)\b(GlobeNewswire|PR Newswire|PRNewswire|Business Wire|BusinessWire|ACN Newswire)\b'
        strength: hint
        note: A press release from anyone, including Chinese companies such as Huawei or vivo, which are not the state. Never counts toward A on its own or in combination; the LLM checks the issuer. Ruleset 2026.09.2 downgraded this from weak after company releases in a partner outlet combined with the outlet's advertorial label to give false A.

  sponsored_placement:
    description: Branded, sponsored and paid placement disclosures, per language. Alone these say only that
      someone paid; with a Chinese state entity they say who. A bare disclosure counts only where one attached
      to this article sits (author field, headline, opening of the body), never in page labels, because those
      carry navigation strips, ad slots and site-wide menu items that name no article.
    patterns:
      - id: sponsored_with_state_entity_en
        regex: '(?is)\b(sponsored (content|by|post|feature|article)|paid (post|content|partnership|for by)|branded content|advertorial|partner content|brought to you by|promoted content|advertisement feature|special report by)\b.{0,600}?\b(China Daily|CGTN|Xinhua|Global Times|China Media Group|CCTV|People.s Daily|Chinese Embassy|Embassy of (the People.s Republic of )?China|Consulate General of (the People.s Republic of )?China|China Cultural Cent(er|re)|Confucius Institute|Hainan|Guangdong|Shandong|Sichuan|Zhejiang|Jiangsu|Fujian|Hubei|Hunan|Yunnan|Chongqing|Tianjin|Shanghai|Beijing)\b.{0,80}?\b(government|province|provincial|municipal|department|bureau|administration|office|committee|council|daily|times|CGTN|Xinhua|embassy|consulate|institute|group|cent(er|re)|People.s Daily)\b'
        strength: strong
        scope: labels_head_tail
      - id: state_entity_then_sponsored_en
        regex: '(?is)\b(China Daily|CGTN|Xinhua|Global Times|China Media Group|CCTV|People.s Daily|Chinese Embassy|Embassy of (the People.s Republic of )?China)\b.{0,600}?\b(sponsored (content|by|post|feature)|paid (post|content|partnership|for by)|branded content|advertorial|partner content|brought to you by|promoted content)\b'
        strength: strong
        scope: labels_head_tail
      - id: china_watch_supplement
        regex: '(?i)\bChina Watch\b.{0,200}\b(China Daily|supplement|paid|sponsored|advertising)\b|\b(China Daily)\b.{0,200}\bChina Watch\b'
        strength: strong
        scope: labels_head_tail
        note: The China Watch supplement is a China Daily paid insert.
      - id: sponsored_en
