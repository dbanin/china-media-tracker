      - '(?:주한 중국대사관|주한중국대사관|중국 ?대사관|중국 ?정부|중국 ?외교부|중국 ?공산당|중국 국무원|중국 ?국무원 ?신문판공실|중국 ?공공외교협회|중화전국신문공작자협회|중국 ?기자협회|중국 ?국제 ?신문 ?교류 ?센터|중국중앙텔레비전)'
    triggers: [초청, 지원, 후원, 부담, 제공]
    anchors:
      - id: ko_chocheong
        regex: '(?:의 )?(?:초청으로|초청을 받아)'
        host: before
        tail_ok: true
        note: 이 기사는 중국 외교부의 초청으로 이뤄진 취재를 바탕으로 작성됐다.
      - id: ko_jiwon
        regex: '(?:의 )?(?:지원으로|지원을 받아|후원으로|후원을 받아)'
        host: before
        tail_ok: true
        needs_travel: true
        note: 본 취재는 주한 중국대사관의 지원을 받아 진행됐다; sponsored content with no trip is not a hosted trip.
      - id: ko_budam
        regex: '(?:측이|측에서|이|가) (?:부담했다|부담했습니다|부담했으며|지원했다|제공했다)'
        host: before
        tail_ok: true
        needs_travel: true
        note: 필자의 항공료와 숙박비는 중국 정부가 부담했다.

  vi:
    self: '\b(?:phóng viên|tác giả|người viết|bài viết này|bài báo này)\b'
    bio: '\blà (?:một )?(?:[\w-]+ ){0,2}?(?:phóng viên|nhà báo|tác giả|biên tập viên)\b'
    label: '(?:ghi chú|lưu ý của tòa soạn|công bố)\s*[:.]'
    not_subject: '\b(?:chủ tịch|tổng thống|thủ tướng|bộ trưởng|đoàn đại biểu|đội tuyển|cầu thủ|quan chức|đại sứ|đại biểu|sinh viên|công ty|theo báo chí|theo nguồn tin|cho biết|phát biểu)\b'
    travel: '\b(?:chuyến đi|chuyến thăm|chuyến công tác|lưu trú|vé máy bay|chi phí|đào tạo|tập huấn|chương trình|khóa học)\b'
    unnamed: '^(?:ban tổ chức|nước chủ nhà|phía chủ nhà|nhà tài trợ|phía mời)\b'
    state_hosts:
      - '\b(?:Đại sứ quán|Tổng Lãnh sự quán|Chính phủ|Bộ Ngoại giao|Quốc vụ viện) (?:nước Cộng hòa Nhân dân )?(?:Trung Quốc|Trung Hoa)\b|\bĐảng Cộng sản Trung Quốc\b'
      - '\b(?:Văn phòng Thông tin Quốc vụ viện|Hội Nhà báo Toàn Trung Quốc|Hiệp hội Nhà báo Trung Quốc|Hiệp hội Ngoại giao Nhân dân Trung Quốc|Hiệp hội Ngoại giao Công chúng Trung Quốc|Trung tâm Giao lưu Báo chí Quốc tế Trung Quốc|Tổng đài Phát thanh Truyền hình Trung ương Trung Quốc)\b'
    triggers: [lời mời, tài trợ, chi trả, tổ chức, bảo trợ]
    anchors:
      - id: vi_loi_moi
        regex: '\b(?:theo lời mời của)\s*'
        host: after
        tail_ok: true
        note: Phóng viên đến Trung Quốc theo lời mời của ...
      - id: vi_tai_tro
        regex: '\b(?:với sự tài trợ của|với sự bảo trợ của|do\s+(?=[^.!?\n]{1,60}?\b(?:tài trợ|chi trả|tổ chức|bảo trợ)\b))\s*'
        host: after
        tail_ok: true
        needs_travel: true
        note: Chuyến đi do ... tài trợ; chương trình đào tạo do ... tổ chức. Sponsored content with no trip is not a hosted trip.
