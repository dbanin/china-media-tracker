# Hosted travel disclosures (pipeline/hosted_travel.py). Lines in which an article discloses that the
# reporting trip, the stay or a training programme was paid for or hosted by someone: "the writer
# travelled as a guest of ...", "the trip was sponsored by ...", "Transparenzhinweis: Die Reise wurde
# von ... bezahlt". A disclosure flag only (scratchpad DECISIONS D8, 2026-10-28): it is never a route
# to state origin, never a label and never a count in the categories, and nothing here touches the
# ruleset (signatures.yaml) or the China gate, so RULESET_VERSION and GATE_VERSION do not change.
#
# How a line is read:
#   1. An anchor below matches the disclosure: a travel, stay or training phrase tied to who paid
#      for it or hosted it. The host is read from the text after the anchor (host: after), before it
#      (host: before, for languages and phrasings that name the host first) or from the anchor's own
#      named group (host: group, (?P<host>...)). The host stops at the end of the sentence or clause.
#   2. The line has to be a disclosure about the article's own reporting, not news about someone
#      else's trip. It counts when (a) the sentence names the article or its author as the subject
#      (self), (b) the line or the sentence opens with a disclosure label (label), or (c) the anchor allows it
#      (tail_ok) and the line is a short line in the last part of the body whose subject is not a
#      politician, delegation or team (tail). A line inside quotation marks never counts.
#   3. The host decides the class. state_host: the host names a Chinese state entity, embassy, state
#      media outlet or Chinese government programme, by classify_rules.has_state_entity or by the
#      state_hosts patterns below. unnamed_host: the host is an unnamed host ("the organisers", "the
#      host government"), a weaker class reported apart. Any other named host (a tournament, a
#      company, a tourism board outside China) gives no flag.
#   needs_travel: the anchor is a generic phrase ("supported by", "unterstützt von") and counts only
#   in a sentence that also names a trip, a stay or a training programme (the language's travel).
#   (d) An author note at the end (bio): a short last paragraph that names the author ("Jane Doe is a
#   freelance journalist in Lagos. She travelled ...") counts for every anchor, by the language's
#   self or bio regex over that paragraph. not_subject is read on the sentence without the host, so
#   "at the invitation of the Chinese ambassador" does not make the ambassador the subject; it also
#   lists reporting words ("said", "according to"), since a reported line is news about a trip.
#   A host text that names only a subnational government ("the Provincial Government", "Government
#   of X Province", "Department of Culture and Tourism") counts only next to a Chinese place name
#   (china_places), because South Africa, Pakistan, Indonesia and the Gulf have bodies of those names.
#
# Top level: version, china_places (a regex, see (d)), languages.
# Fields per language: self, label, not_subject, travel, unnamed (regexes, case insensitive), bio
# (optional regex, an author note such as "is a freelance journalist"), also (other language codes
# the block reads), state_hosts (list of
# regexes added to has_state_entity), triggers (plain words, any one of which must appear in the
# body before the anchors are tried; a cheap prefilter), anchors (id, regex,
# host, tail_ok, needs_travel, note). Ids are stable and never reused. Every regex is compiled with
# re.IGNORECASE and re.UNICODE. Bump version on any change: a changed version rescans every body.
version: "2026.10.2"

# Chinese provinces, regions and the cities whose governments host press trips, in English and in the
# forms the other languages use; a subnational government counts as a Chinese state host only next to
# one of these (see the note above).
china_places: '\b(?:Anhui|Beijing|Peking|Pékin|Pekín|Pequim|Pechino|Chongqing|Fujian|Gansu|Guangdong|Guangxi|Guizhou|Hainan|Hebei|Heilongjiang|Henan|Hubei|Hunan|Inner Mongolia|Jiangsu|Jiangxi|Jilin|Liaoning|Ningxia|Qinghai|Shaanxi|Shandong|Shanghai|Shanxi|Sichuan|Tianjin|Tibet|Xizang|Xinjiang|Yunnan|Zhejiang|Guangzhou|Shenzhen|Hangzhou|Chengdu|Xi''an|Wuhan|Nanjing|Kunming|Harbin|Lhasa|Urumqi|Kashgar|Xiamen|Qingdao|Dalian|Suzhou|Guilin|Sanya|Haikou|Changsha|Zhengzhou|Hefei|Fuzhou|Nanning|Guiyang|Lanzhou|Xining|Yinchuan|Hohhot|Shenyang|Changchun|Jinan|Taiyuan|Shijiazhuang|Ningbo|Yiwu|Hong Kong|Macao|Macau)\b'

languages:
  en:
    self: '\b(?:the|this) (?:writer|author|reporter|journalist|correspondent|columnist|photographer|contributor)(?!s\b|s''|s’)\b|\bour (?:writer|author|reporter|journalist|correspondent|columnist|photographer|contributor)s?\b|\bthis (?:article|story|report|piece|feature|reporting|series|podcast|episode|dispatch)\b|\b(?:the )?(?:writer|author|reporter)(?:''s|’s)\b|(?<![\w"“])I (?:travel|was|went|visited|attended|flew|stayed|took|joined|spent)'
    bio: '\b(?:is|was) (?:an? |the )?(?:[\w-]+ ){0,3}?(?:journalist|reporter|writer|correspondent|editor|columnist|photographer|producer|contributor)\b'
    label: '(?:disclosure|disclaimer|editor(?:''s|’s)? note|note to readers|full disclosure|transparency note|transparency)\s*[:.]'
    not_subject: '\b(?:president|prime minister|premier|minister|secretary|delegation|delegates|king|queen|prince|princess|team|squad|players?|officials?|governor|mayor|senator|ambassador|chancellor|lawmakers?|MPs?|legislators|students|athletes|leaders?|army|troops|band|orchestra|company|firm|executives?|(?:state|official|working) visit|said|says|told|according to|found|reported|alleged|claimed|denied|insisted)\b|\bIn (?:1[89]\d\d|20[01]\d)\b'
    travel: '\b(?:trip|travel|travelled|traveled|visit|visited|tour|journey|flights?|airfares?|accommodation|lodging|hotel|stay|reporting|press trip|study tour|training|programme|program|fellowship|course|seminar|workshop|exchange)\b'
    unnamed: '^(?:the |its |their |his |her |our |an? )?(?:hosts?|organi[sz]ers?|organi[sz]ing (?:committee|body|team)|host (?:government|country|organi[sz]ation|institution|city)|sponsors?|inviting (?:party|organi[sz]ation|government)|(?:foreign )?government(?! of\b)|government (?:agency|programme|program))\b'
    state_hosts:
      - '\b(?:Chinese|China''s|China’s) (?:government|authorities|state|foreign ministry|ministry of [a-z ]+|embassy|consulate|mission)\b'
      - '\b(?:government|state council|embassy|consulate|consulate[- ]general|mission) of (?:the )?(?:People''s Republic of |People’s Republic of |P\.?R\.? )?China\b'
      - '\b(?:All[- ]China Journalists(?:''|’)? Association|ACJA|China International Press Communication Cent(?:er|re)|CIPCC|China[- ](?:Africa|Asia[- ]Pacific|Latin America|Arab(?: States)?|Central Asia|ASEAN|South Asia|Pacific Island|Eurasia)(?: and Caribbean)? Press (?:Cent(?:er|re)|Center Program|Centre Programme)|China Public Diplomacy Association|Chinese Academy of Social Sciences|International Department of the (?:CPC|Communist Party of China|Central Committee)|Belt and Road News Network|China Scholarship Council|Chinese People(?:''|’)s Institute of Foreign Affairs|Chinese People(?:''|’)s Association for Friendship with Foreign Countries|China Foreign Affairs University|MOFCOM|China Global Television Network|State Council of (?:the People(?:''|’)s Republic of )?China|CPC Central Committee)\b'
      # Chinese provincial and city bodies named in English; the place is required (china_places).
      - '\b(?:Anhui|Beijing|Chongqing|Fujian|Gansu|Guangdong|Guangxi|Guizhou|Hainan|Hebei|Heilongjiang|Henan|Hubei|Hunan|Inner Mongolia|Jiangsu|Jiangxi|Jilin|Liaoning|Ningxia|Qinghai|Shaanxi|Shandong|Shanghai|Shanxi|Sichuan|Tianjin|Tibet|Xizang|Xinjiang|Yunnan|Zhejiang|Guangzhou|Shenzhen|Hangzhou|Chengdu|Wuhan|Nanjing|Kunming|Lhasa|Urumqi|Xiamen|Qingdao|Dalian|Suzhou|Guilin|Sanya|Haikou)(?: (?:Provincial|Municipal|City|Uygur|Uyghur|Zhuang|Hui|Autonomous|Region|Regional))*(?: People(?:''|’)s Government)?(?: (?:Foreign Affairs|Information|Publicity|Press|Media) Office| (?:Department|Bureau|Commission) of (?:Culture and Tourism|Foreign Affairs|Commerce)| Government| Party Committee)\b'
      - '\b(?:Foreign Affairs|Information) Office of (?:the )?(?:Anhui|Beijing|Chongqing|Fujian|Gansu|Guangdong|Guangxi|Guizhou|Hainan|Hebei|Heilongjiang|Henan|Hubei|Hunan|Inner Mongolia|Jiangsu|Jiangxi|Jilin|Liaoning|Ningxia|Qinghai|Shaanxi|Shandong|Shanghai|Shanxi|Sichuan|Tianjin|Tibet|Xizang|Xinjiang|Yunnan|Zhejiang)\b'
    triggers: [guest, invitation, invited, sponsored, "paid for", funded, financed, hosted, courtesy, "provided by", "covered by", "covered the", "organised by", "organized by", "arranged by", "run by", support, participant, fellow, "took part", attended, underwritten, subsidised, subsidized, expense, facilitat, provided, covered, arranged, "guest of", "guests of"]
    anchors:
      - id: en_guest_of
        regex: '\b(?:as (?:a |the )?guests? of|(?:was|were|is|are) (?:a |the )?guests? of|at the (?:invitation|expense) of|on (?:an |a )?invitation (?:from|of))\s+'
        host: after
        tail_ok: true
        note: The writer travelled to Shanghai as a guest of ..., the reporter visited at the invitation of ...
      - id: en_trip_paid_by
        regex: '\b(?:trip|travel|travels|visit|tour|journey|flights?|airfares?|accommodation|lodging|hotel|stay|expenses|costs|reporting trip|press trip|press tour|media tour|study tour)(?:\s+(?:costs|expenses))?(?:\s*(?:,|and)\s*(?:the )?[a-z]+){0,3}(?:\s+(?:to|in|for|of|during|across|through)\s+(?:this |the |my |our )?[\w''’ -]{1,40}?)?\s+(?:was|were|is|are|has been|have been|had been)\s+(?:(?:partly|partially|fully|wholly|generously|kindly|entirely)\s+)?(?:sponsored|paid for|funded|financed|covered|provided|organi[sz]ed|arranged|hosted|underwritten|subsidi[sz]ed|facilitated)(?:\s+and\s+(?:sponsored|paid for|funded|financed|covered|provided|organi[sz]ed|arranged|hosted|underwritten|subsidi[sz]ed|facilitated))?\s+by\s+'
        host: after
        tail_ok: true
        note: The trip was sponsored by ..., travel and accommodation for this article were provided by ..., the visit was arranged and paid for by ...
      - id: en_travelled_courtesy
        regex: '\b(?:travel(?:l)?ed|flew|stayed|visited|went|toured)\b[^.!?\n]{0,80}?\b(?:courtesy of|with (?:the )?(?:financial )?support (?:of|from)|on (?:an? )?[a-z -]{0,30}?(?:trip|visit|tour|programme|program) (?:sponsored|organi[sz]ed|hosted|funded|paid for|arranged) by|(?:sponsored|funded|hosted|paid for) by)\s+'
        host: after
        tail_ok: true
        note: The writer travelled to Beijing courtesy of ..., flew to Urumqi on a press tour organised by ...
      - id: en_training_by
        regex: '\b(?:training|programme|program|fellowship|course|seminar|workshop|exchange|scholarship|residency)\b[^.!?\n]{0,60}?\b(?:organi[sz]ed|hosted|run|funded|sponsored|paid for|offered|financed)\s+by\s+'
        host: after
        tail_ok: false
        note: Training programmes; needs the author as subject, an author note or a disclosure label.
      - id: en_participant
        regex: '\b(?:(?:was|is|were|are) (?:a |an )?(?:participant|fellow|delegate|trainee|guest)s? (?:in|on|of|at)|(?:took|takes|taking) part in|participated in|(?:was|were) (?:attending|on))\s+(?=[^.!?\n]{0,100}?\b(?:programme|program|fellowship|training|course|seminar|workshop|exchange|press cent(?:re|er)|media (?:tour|exchange)|study tour|press tour)\b)'
        host: after
        tail_ok: false
        note: The author was a participant in the China-Africa Press Centre programme; the programme name is the host.
      - id: en_reverse_paid
        regex: '\b(?:paid for|sponsored|funded|financed|covered|organi[sz]ed|arranged|hosted)\s+(?:the (?:full )?(?:costs?|expenses) of\s+)?(?:(?:my|our)\s+|(?:the |this )?(?:writer|author|reporter|journalist|correspondent)(?:''s|’s|s''|s’)\s+)(?:\w+\s+)?(?:trip|travel|visit|flights?|accommodation|stay|participation)\b'
        host: before
        tail_ok: true
        note: The Chinese Embassy paid for the writer's trip; the consulate covered the cost of my travel.
      - id: en_on_trip_by
        regex: '\b(?:during|on|as part of|through|in the course of) (?:an? |the )?[a-z -]{0,30}?(?:trip|tour|visit|programme|program|fellowship|exchange)\s+(?:(?:that|which) was\s+)?(?:organi[sz]ed|sponsored|hosted|funded|financed|paid for|arranged|run|offered|underwritten)(?:\s+and\s+(?:organi[sz]ed|sponsored|hosted|funded|financed|paid for|arranged|run))?\s+by\s+'
        host: after
        tail_ok: true
        note: This story was reported during a press trip organised by ...; he visited as part of a programme hosted by ...
      - id: en_support_from
        regex: '\b(?:with|thanks to|through) (?:the )?(?:travel|financial|logistical|reporting)\s+(?:support|assistance|funding|grant|help)\s+(?:from|of|by)\s+'
        host: after
        tail_ok: true
        note: This article was produced with travel support from ...
      - id: en_hosted_by
        regex: '\b(?:was|were) (?:hosted|invited|accommodated)\b[^.!?\n]{0,40}?\bby\s+'
        host: after
        tail_ok: false
        note: The journalist was hosted in Beijing by ...; needs the author as subject, an author note or a label.

  fr:
    self: '\b(?:l[''’](?:auteur|autrice|auteure|envoyée? spéciale?)|(?:le|la|notre|cette|ce) (?:journaliste|reporter|envoyée? spéciale?|correspondante?|auteure?|autrice|photographe)|(?:cet article|ce reportage|cette enquête|ce papier|cette série))\b|\bnotre (?:envoyée?|correspondante?)\b'
    bio: '\best (?:une? )?(?:[\w-]+ ){0,2}?(?:journaliste|reporter|correspondante?|rédact(?:eur|rice)|photographe|écrivaine?)\b'
    label: '(?:transparence|note de la rédaction|ndlr|précision|avertissement|à noter)\s*[:.)]'
    not_subject: '\b(?:président|présidente|premier ministre|ministre|délégation|délégués|roi|reine|équipe|joueurs?|responsables|gouverneur|maire|sénateur|ambassadeur|chancelier|députés|étudiants|athlètes|dirigeants?|entreprise|société|selon|a déclaré|a affirmé|a dit|a indiqué)\b'
    travel: '\b(?:voyage|séjour|déplacement|visite|hébergement|vols?|billets?|frais|formation|stage|programme|reportage|tournée|bourse|séminaire|atelier)\b'
    unnamed: '^(?:les |l[''’]|leurs? |ses |des |du |de la |de l[''’]|d[''’]|un |une )?(?:hôtes?|organisat(?:eur|eurs|rice|rices)|comité d[''’]organisation|pays (?:hôte|d[''’]accueil)|gouvernement (?:hôte|d[''’]accueil)|autorités (?:locales|du pays)|sponsors?|un gouvernement)\b'
    state_hosts:
      - '\b(?:gouvernement|autorités|ambassade|consulat|ministère des affaires étrangères|État) (?:chinois(?:e|es)?|de (?:la )?(?:République populaire de )?Chine)\b'
      - '\b(?:Association chinoise (?:de|pour la) diplomatie publique|Association des journalistes (?:de Chine|chinois)|Association nationale des journalistes de Chine|Centre (?:de presse )?(?:Chine|sino)[- ]Afrique|Centre international de communication de (?:la )?presse de Chine|Bureau (?:de l[''’])?information du Conseil des affaires d[''’]État|Conseil des affaires d[''’]État(?: chinois| de Chine)?|ministère chinois des Affaires étrangères|Parti communiste chinois|Groupe de médias de Chine|Agence Chine nouvelle)\b'
    triggers: [invit, "frais", financ, "pris en charge", "prise en charge", organis, sponsoris, parrain, particip, offert, payé, assuré, couvert, "à la charge", "pris part", boursi, stagiaire]
    anchors:
      - id: fr_invitation
        regex: '(?:\b(?:à|sur) l[''’]invitation|\b(?:grâce à|suite à|sur) une invitation|\bsur invitation|\baux frais|\bà la charge|\b(?:en tant qu[''’]|comme )invitée?s?|\binvitée?s? (?:par|de))\s*(?:d[''’]|de |du |des |par )?'
        host: after
        tail_ok: true
        note: L'auteur s'est rendu en Chine à l'invitation de ..., aux frais de ...
      - id: fr_voyage_finance
        regex: '\b(?:voyage|séjour|déplacement|visite|hébergement|vols?|billets?|frais|tournée|reportage)\b[^.!?\n]{0,60}?\b(?:a|ont|avait|avaient|est|sont|était|étaient)\s+(?:(?:été|entièrement|partiellement|en partie|intégralement)\s+){1,2}(?:pris(?:e|es)? en charge|financée?s?|payée?s?|organisée?s?|offerte?s?|sponsorisée?s?|parrainée?s?|assurée?s?|couverte?s?)(?:\s+et\s+(?:pris(?:e|es)? en charge|financée?s?|payée?s?|organisée?s?|offerte?s?|sponsorisée?s?|parrainée?s?))?(?:\s+(?:entièrement|intégralement|en partie))?\s+par\s+'
        host: after
        tail_ok: true
        note: Ce voyage a été financé par ..., les frais de séjour ont été pris en charge par ..., organisé et financé par ...
      - id: fr_formation
        regex: '\b(?:a participé|participait|participe|a pris part|prenait part|était (?:boursier|boursière|stagiaire))\s+(?:à|au|aux)\s+(?=[^.!?\n]{0,100}?\b(?:programme|formation|stage|séminaire|atelier|bourse|échange|centre de presse)\b)'
        host: after
        tail_ok: false
        note: Le journaliste a participé au programme du Centre de presse Chine-Afrique.
      - id: fr_voyage_organise
        regex: '\b(?:voyage|séjour|déplacement|tournée|visite|programme|stage)\s+(?:de presse\s+|d[''’]étude\s+)?(?:organisée?s?|financée?s?|offerte?s?|parrainée?s?|sponsorisée?s?|pris(?:e|es)? en charge)\s+par\s+'
        host: after
        tail_ok: true
        note: lors d'un voyage de presse organisé par ...

  es:
    self: '\b(?:el|la|este|esta|nuestr[oa]) (?:autor[a]?|periodista|reporter[oa]?|enviad[oa] especial|corresponsal|redactor[a]?|fotógraf[oa])\b|\b(?:este (?:artículo|reportaje|texto|trabajo)|esta (?:nota|crónica|serie|investigación))\b'
    bio: '\bes (?:una? )?(?:[\w-]+ ){0,2}?(?:periodista|reporter[oa]?|corresponsal|redactor[a]?|fotógraf[oa]|escritor[a]?)\b'
    label: '(?:nota (?:del editor|de la redacción|de transparencia)|transparencia|aviso|aclaración)\s*[:.]'
    not_subject: '\b(?:presidente|presidenta|primer ministro|ministr[oa]|delegación|delegados|rey|reina|equipo|selección|jugadores?|funcionarios|gobernador[a]?|alcalde(?:sa)?|senador[a]?|embajador[a]?|canciller|diputados|estudiantes|atletas|dirigentes?|líderes?|empresa|compañía|según|dijo|afirmó|declaró|aseguró)\b'
    travel: '\b(?:viaje|visita|estancia|estadía|alojamiento|vuelos?|pasajes?|boletos?|gastos|formación|capacitación|programa|curso|gira|beca|seminario|taller|intercambio)\b'
    unnamed: '^(?:los |las |el |la |sus |del |de los |de las |de la |un |una )?(?:anfitrion(?:es|a)?|organizador(?:es|a|as)?|comité organizador|país anfitrión|gobierno anfitrión|patrocinador(?:es)?|un gobierno)\b'
    state_hosts:
      - '\b(?:gobierno|autoridades|embajada|consulado|cancillería|ministerio de relaciones exteriores|ministerio de asuntos exteriores|Estado) (?:chin[oa]s?|de (?:la )?(?:República Popular (?:de )?)?China)\b'
      - '\b(?:Asociación (?:de Diplomacia Pública de China|China de Diplomacia Pública)|Asociación de Periodistas de (?:toda )?China|Asociación Nacional de Periodistas de China|Centro de Prensa China[- ](?:América Latina|Latinoamérica|África)(?: y (?:el )?Caribe)?|Centro Internacional de Comunicación de Prensa de China|Oficina de Información del Consejo de Estado|Consejo de Estado (?:de China|chino)|Partido Comunista (?:de )?China|Grupo de Medios de China|Agencia (?:de noticias )?Xinhua)\b'
    triggers: [invit, financiad, pagad, costead, patrocinad, auspiciad, cubiert, "a cargo", "a costa", particip, organizad, ofrecid, sufragad, becari, "tomó parte", "con cargo"]
    anchors:
      - id: es_invitacion
        regex: '\b(?:(?:por|a|tras|gracias a) (?:una )?invitación|(?:como|en calidad de) invitad[oa]s?|invitad[oa]s? por)\s+(?:de(?:l)?\s+)?|\ba costa del?\s+|\bcon cargo al?\s+'
        host: after
        tail_ok: true
        note: El periodista viajó a China invitado por ..., por invitación de ..., gracias a una invitación de ...
      - id: es_viaje_financiado
        regex: '\b(?:viaje|visita|estancia|estadía|alojamiento|vuelos?|pasajes?|boletos?|gastos|gira)\b[^.!?\n]{0,60}?\b(?:fue|fueron|ha sido|han sido|había sido|era|eran|es|son|estuvo|estuvieron)\s+(?:(?:totalmente|parcialmente|íntegramente|enteramente)\s+)?(?:financiad[oa]s?|pagad[oa]s?|costead[oa]s?|organizad[oa]s?|patrocinad[oa]s?|cubiert[oa]s?|ofrecid[oa]s?|auspiciad[oa]s?|sufragad[oa]s?)(?:\s+y\s+(?:financiad[oa]s?|pagad[oa]s?|costead[oa]s?|organizad[oa]s?|patrocinad[oa]s?))?(?:\s+(?:totalmente|parcialmente|íntegramente|enteramente))?\s+por\s+'
        host: after
        tail_ok: true
        note: El viaje fue financiado por ..., los gastos fueron cubiertos por ..., financiado íntegramente por ...
      - id: es_capacitacion
        regex: '\b(?:participó|participa|participaba|tomó parte|fue becari[oa])\s+(?:en|del|de)\s+(?=[^.!?\n]{0,100}?\b(?:programa|curso|capacitación|seminario|taller|beca|intercambio|centro de prensa)\b)'
        host: after
        tail_ok: false
        note: La autora participó en el programa del Centro de Prensa China-América Latina.
      - id: es_gira_organizada
        regex: '\b(?:viaje|gira|visita|programa|recorrido)\s+(?:de prensa\s+|periodístic[oa]\s+|informativ[oa]\s+)?(?:organizad[oa]|financiad[oa]|patrocinad[oa]|pagad[oa]|costead[oa]|auspiciad[oa])\s+por\s+'
        host: after
        tail_ok: true
        note: en una gira de prensa organizada por ...

  pt:
    self: '\b(?:o|a|este|esta|noss[oa]) (?:autor[a]?|jornalista|repórter|enviad[oa] especial|correspondente|fotógraf[oa])\b|\b(?:esta (?:reportagem|matéria|série)|este (?:artigo|texto|trabalho))\b'
    bio: '\bé (?:uma? )?(?:[\w-]+ ){0,2}?(?:jornalista|repórter|correspondente|redator[a]?|fotógraf[oa]|escritor[a]?)\b'
    label: '(?:nota (?:do editor|da redação|de transparência)|transparência|aviso|esclarecimento)\s*[:.]'
