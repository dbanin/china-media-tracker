# Hosted travel disclosures (pipeline/hosted_travel.py). Lines in which an article discloses that the
# reporting trip, the stay or a training programme was paid for or hosted by someone: "the writer
# travelled as a guest of ...", "the trip was sponsored by ...", "Transparenzhinweis: Die Reise wurde
# von ... bezahlt". A disclosure flag only (scratchpad DECISIONS D8, 2026-10-28): it is never a route
# to state origin, never a label and never a count in the categories, and nothing here touches the
# ruleset (signatures.yaml) or the China gate, so RULESET_VERSION and GATE_VERSION do not change.
#
# How a line is read:
#   1. An anchor below matches the disclosure: a travel, stay or training phrase tied to who paid
#      for it or hosted it. The host is read from the text after the anchor (host: after), before it
#      (host: before, for languages and phrasings that name the host first) or from the anchor's own
#      named group (host: group, (?P<host>...)). The host stops at the end of the sentence or clause.
#   2. The line has to be a disclosure about the article's own reporting, not news about someone
#      else's trip. It counts when (a) the sentence names the article or its author as the subject
#      (self), (b) the line opens with a disclosure label (label), or (c) the anchor allows it
#      (tail_ok) and the line is a short line in the last part of the body whose subject is not a
#      politician, delegation or team (tail). A line inside quotation marks never counts.
#   3. The host decides the class. state_host: the host names a Chinese state entity, embassy, state
#      media outlet or Chinese government programme, by classify_rules.has_state_entity or by the
#      state_hosts patterns below. unnamed_host: the host is an unnamed host ("the organisers", "the
#      host government"), a weaker class reported apart. Any other named host (a tournament, a
#      company, a tourism board outside China) gives no flag.
#   needs_travel: the anchor is a generic phrase ("supported by", "unterstützt von") and counts only
#   in a sentence that also names a trip, a stay or a training programme (the language's travel).
#
# Fields per language: self, label, not_subject, travel, unnamed (regexes, case insensitive),
# state_hosts (list of regexes added to has_state_entity), triggers (plain words, any one of which
# must appear in the body before the anchors are tried; a cheap prefilter), anchors (id, regex,
# host, tail_ok, needs_travel, note). Ids are stable and never reused. Every regex is compiled with
# re.IGNORECASE and re.UNICODE. Bump version on any change: a changed version rescans every body.
version: "2026.10.1"

languages:
  en:
    self: '\b(?:the|this|our) (?:writer|author|reporter|journalist|correspondent|columnist|photographer|contributor)s?\b|\bthis (?:article|story|report|piece|feature|reporting|series|podcast|episode)\b|\b(?:the )?(?:writer|author|reporter)(?:''s|’s)\b|(?<![\w"“])I (?:travel|was|went|visited|attended|flew|stayed|took|joined|spent)'
    label: '(?:disclosure|disclaimer|editor(?:''s|’s)? note|note to readers|full disclosure|transparency note)\s*[:.]'
    not_subject: '\b(?:president|prime minister|premier|minister|secretary|delegation|delegates|king|queen|prince|princess|team|squad|players?|officials?|governor|mayor|senator|ambassador|chancellor|lawmakers?|MPs?|legislators|students|athletes|leaders?|army|troops|band|orchestra|company|firm|executives?|(?:state|official|working) visit)\b'
    travel: '\b(?:trip|travel|travelled|traveled|visit|visited|tour|journey|flights?|airfares?|accommodation|lodging|hotel|stay|reporting|press trip|study tour|training|programme|program|fellowship|course|seminar|workshop|exchange)\b'
    unnamed: '^(?:the |its |their |his |her |our |an? )?(?:hosts?|organi[sz]ers?|organi[sz]ing (?:committee|body|team)|host (?:government|country|organi[sz]ation|institution|city)|sponsors?|inviting (?:party|organi[sz]ation|government)|(?:foreign )?government(?! of\b)|government (?:agency|programme|program))\b'
    state_hosts:
      - '\b(?:Chinese|China''s|China’s) (?:government|authorities|state|foreign ministry|ministry of [a-z ]+|embassy|consulate|mission)\b'
      - '\b(?:government|state council|embassy|consulate|consulate[- ]general|mission) of (?:the )?(?:People''s Republic of |People’s Republic of |P\.?R\.? )?China\b'
      - '\b(?:All[- ]China Journalists(?:''|’)? Association|ACJA|China International Press Communication Cent(?:er|re)|CIPCC|China[- ](?:Africa|Asia[- ]Pacific|Latin America|Arab|Central Asia|ASEAN|South Asia)(?: and Caribbean)? Press (?:Cent(?:er|re)|Center Program|Centre Programme)|China Public Diplomacy Association|Chinese Academy of Social Sciences|International Department of the (?:CPC|Communist Party of China|Central Committee)|Belt and Road News Network|China Scholarship Council|Chinese People(?:''|’)s Institute of Foreign Affairs|China Foreign Affairs University|MOFCOM)\b'
      - '\b(?:[A-Z][a-z]+ )?(?:Provincial |Municipal )?(?:Department|Bureau|Commission) of Culture and Tourism\b'
    triggers: [guest, invitation, invited, sponsored, "paid for", funded, financed, hosted, courtesy, "provided by", "covered by", "organised by", "organized by", "arranged by", "support", participant, fellow, "took part", attended, underwritten, subsidised, subsidized]
    anchors:
      - id: en_guest_of
        regex: '\b(?:as (?:a |the )?guests? of|at the (?:invitation|expense) of|on (?:an |a )?invitation (?:from|of))\s+'
        host: after
        tail_ok: true
        note: The writer travelled to Shanghai as a guest of ..., the reporter visited at the invitation of ...
      - id: en_trip_paid_by
        regex: '\b(?:trip|travel|travels|visit|tour|journey|flights?|airfares?|accommodation|lodging|hotel|stay|expenses|costs|reporting trip|press trip|press tour|media tour|study tour)(?:\s*(?:,|and)\s*[a-z]+){0,3}\s+(?:was|were|is|are|has been|have been|had been)\s+(?:(?:partly|partially|fully|wholly|generously|kindly)\s+)?(?:sponsored|paid for|funded|financed|covered|provided|organi[sz]ed|arranged|hosted|underwritten|subsidi[sz]ed|facilitated)\s+by\s+'
        host: after
        tail_ok: true
        note: The trip was sponsored by ..., travel and accommodation were provided by ...
      - id: en_travelled_courtesy
        regex: '\b(?:travel(?:l)?ed|flew|stayed|visited|went|toured)\b[^.!?\n]{0,80}?\b(?:courtesy of|with (?:the )?(?:financial )?support (?:of|from)|on (?:an? )?[a-z -]{0,30}?(?:trip|visit|tour|programme|program) (?:sponsored|organi[sz]ed|hosted|funded|paid for|arranged) by|(?:sponsored|funded|hosted|paid for) by)\s+'
        host: after
        tail_ok: true
        note: The writer travelled to Beijing courtesy of ..., flew to Urumqi on a press tour organised by ...
      - id: en_training_by
        regex: '\b(?:training|programme|program|fellowship|course|seminar|workshop|exchange|scholarship|residency)\b[^.!?\n]{0,60}?\b(?:organi[sz]ed|hosted|run|funded|sponsored|paid for|offered|financed)\s+by\s+'
        host: after
        tail_ok: false
        note: Training programmes; needs the author as subject or a disclosure label.
      - id: en_participant
        regex: '\b(?:(?:was|is|were|are) (?:a |an )?(?:participant|fellow|delegate|trainee|guest)s? (?:in|on|of|at)|(?:took|takes|taking) part in|participated in|(?:was|were) (?:attending|on))\s+(?=[^.!?\n]{0,100}?\b(?:programme|program|fellowship|training|course|seminar|workshop|exchange|press cent(?:re|er)|media (?:tour|exchange)|study tour|press tour)\b)'
        host: after
        tail_ok: false
        note: The author was a participant in the China-Africa Press Centre programme; the programme name is the host.
      - id: en_reverse_paid
        regex: '\b(?:paid for|sponsored|funded|financed|covered|organi[sz]ed|arranged|hosted)\s+(?:the |this |my |our )?(?:writer|author|reporter|journalist|correspondent)(?:''s|’s|s''|s’)?\s+(?:trip|travel|visit|flights?|accommodation|stay|participation)\b'
        host: before
        tail_ok: true
        note: The Chinese embassy paid for the writer's trip.

  fr:
    self: '\b(?:l[''’](?:auteur|autrice|auteure|envoyée? spéciale?)|(?:le|la|notre|cette|ce) (?:journaliste|reporter|envoyée? spéciale?|correspondante?|auteure?|autrice|photographe)|(?:cet article|ce reportage|cette enquête|ce papier|cette série))\b|\bnotre (?:envoyée?|correspondante?)\b'
    label: '(?:transparence|note de la rédaction|ndlr|précision|avertissement|à noter)\s*[:.)]'
    not_subject: '\b(?:président|présidente|premier ministre|ministre|délégation|délégués|roi|reine|équipe|joueurs?|responsables|gouverneur|maire|sénateur|ambassadeur|chancelier|députés|étudiants|athlètes|dirigeants?|entreprise|société)\b'
    travel: '\b(?:voyage|séjour|déplacement|visite|hébergement|vols?|billets?|frais|formation|stage|programme|reportage|tournée|bourse|séminaire|atelier)\b'
    unnamed: '^(?:les |l[''’]|leurs? |ses |des |du |de la |de l[''’]|d[''’]|un |une )?(?:hôtes?|organisat(?:eur|eurs|rice|rices)|comité d[''’]organisation|pays (?:hôte|d[''’]accueil)|gouvernement (?:hôte|d[''’]accueil)|autorités (?:locales|du pays)|sponsors?|un gouvernement)\b'
    state_hosts:
      - '\b(?:gouvernement|autorités|ambassade|consulat|ministère des affaires étrangères|État) (?:chinois(?:e|es)?|de (?:la )?(?:République populaire de )?Chine)\b'
      - '\b(?:Association chinoise (?:de|pour la) diplomatie publique|Association des journalistes de Chine|Centre (?:de presse )?(?:Chine|sino)[- ]Afrique|Centre international de communication de (?:la )?presse de Chine)\b'
    triggers: [invit, "frais", financ, "pris en charge", "prise en charge", organis, sponsoris, parrain, particip, offert]
    anchors:
      - id: fr_invitation
        regex: '(?:\b(?:à|sur) l[''’]invitation|\bsur invitation|\baux frais|\bà la charge|\b(?:en tant qu[''’]|comme )invitée?s?|\binvitée?s? (?:par|de))\s*(?:d[''’]|de |du |des |par )?'
        host: after
        tail_ok: true
        note: L'auteur s'est rendu en Chine à l'invitation de ..., aux frais de ...
      - id: fr_voyage_finance
        regex: '\b(?:voyage|séjour|déplacement|visite|hébergement|vols?|billets?|frais|tournée|reportage)\b[^.!?\n]{0,60}?\b(?:a|ont|avait|avaient|est|sont|était|étaient)\s+(?:(?:été|entièrement|partiellement|en partie)\s+){1,2}(?:pris(?:e|es)? en charge|financée?s?|payée?s?|organisée?s?|offerte?s?|sponsorisée?s?|parrainée?s?|assurée?s?|couverte?s?)\s+par\s+'
        host: after
        tail_ok: true
        note: Ce voyage a été financé par ..., les frais de séjour ont été pris en charge par ...
      - id: fr_formation
        regex: '\b(?:a participé|participait|participe|a pris part|prenait part|était (?:boursier|boursière|stagiaire))\s+(?:à|au|aux)\s+(?=[^.!?\n]{0,100}?\b(?:programme|formation|stage|séminaire|atelier|bourse|échange|centre de presse)\b)'
        host: after
        tail_ok: false
        note: Le journaliste a participé au programme du Centre de presse Chine-Afrique.

  es:
    self: '\b(?:el|la|este|esta|nuestr[oa]) (?:autor[a]?|periodista|reporter[oa]?|enviad[oa] especial|corresponsal|redactor[a]?|fotógraf[oa])\b|\b(?:este (?:artículo|reportaje|texto|trabajo)|esta (?:nota|crónica|serie|investigación))\b'
    label: '(?:nota (?:del editor|de la redacción|de transparencia)|transparencia|aviso|aclaración)\s*[:.]'
    not_subject: '\b(?:presidente|presidenta|primer ministro|ministr[oa]|delegación|delegados|rey|reina|equipo|selección|jugadores?|funcionarios|gobernador[a]?|alcalde(?:sa)?|senador[a]?|embajador[a]?|canciller|diputados|estudiantes|atletas|dirigentes?|líderes?|empresa|compañía)\b'
    travel: '\b(?:viaje|visita|estancia|estadía|alojamiento|vuelos?|pasajes?|boletos?|gastos|formación|capacitación|programa|curso|gira|beca|seminario|taller|intercambio)\b'
    unnamed: '^(?:los |las |el |la |sus |del |de los |de las |de la |un |una )?(?:anfitrion(?:es|a)?|organizador(?:es|a|as)?|comité organizador|país anfitrión|gobierno anfitrión|patrocinador(?:es)?|un gobierno)\b'
    state_hosts:
      - '\b(?:gobierno|autoridades|embajada|consulado|cancillería|ministerio de relaciones exteriores|Estado) (?:chin[oa]s?|de (?:la )?(?:República Popular (?:de )?)?China)\b'
      - '\b(?:Asociación (?:de Diplomacia Pública de China|China de Diplomacia Pública)|Asociación de Periodistas de (?:toda )?China|Centro de Prensa China[- ](?:América Latina|Latinoamérica|África)(?: y (?:el )?Caribe)?|Centro Internacional de Comunicación de Prensa de China)\b'
    triggers: [invit, financiad, pagad, costead, patrocinad, auspiciad, cubiert, "a cargo", "a costa", particip, organizad, ofrecid]
    anchors:
      - id: es_invitacion
        regex: '\b(?:(?:por|a) invitación|(?:como|en calidad de) invitad[oa]s?|invitad[oa]s? por|a costa)\s+(?:de(?:l)?\s+)?|\bcon cargo al?\s+'
        host: after
        tail_ok: true
        note: El periodista viajó a China invitado por ..., por invitación de ...
      - id: es_viaje_financiado
        regex: '\b(?:viaje|visita|estancia|estadía|alojamiento|vuelos?|pasajes?|boletos?|gastos|gira)\b[^.!?\n]{0,60}?\b(?:fue|fueron|ha sido|han sido|había sido|era|eran|es|son|estuvo|estuvieron)\s+(?:(?:totalmente|parcialmente|íntegramente|enteramente)\s+)?(?:financiad[oa]s?|pagad[oa]s?|costead[oa]s?|organizad[oa]s?|patrocinad[oa]s?|cubiert[oa]s?|ofrecid[oa]s?|auspiciad[oa]s?|sufragad[oa]s?)\s+por\s+'
        host: after
        tail_ok: true
        note: El viaje fue financiado por ..., los gastos fueron cubiertos por ...
      - id: es_capacitacion
        regex: '\b(?:participó|participa|participaba|tomó parte|fue becari[oa])\s+(?:en|del|de)\s+(?=[^.!?\n]{0,100}?\b(?:programa|curso|capacitación|seminario|taller|beca|intercambio|centro de prensa)\b)'
        host: after
        tail_ok: false
        note: La autora participó en el programa del Centro de Prensa China-América Latina.

  pt:
    self: '\b(?:o|a|este|esta|noss[oa]) (?:autor[a]?|jornalista|repórter|enviad[oa] especial|correspondente|fotógraf[oa])\b|\b(?:esta (?:reportagem|matéria|série)|este (?:artigo|texto|trabalho))\b'
    label: '(?:nota (?:do editor|da redação|de transparência)|transparência|aviso|esclarecimento)\s*[:.]'
    not_subject: '\b(?:presidente|primeiro-ministro|ministr[oa]|delegação|delegados|rei|rainha|equipe|equipa|seleção|jogadores?|funcionários|governador[a]?|prefeit[oa]|senador[a]?|embaixador[a]?|chanceler|deputados|estudantes|atletas|dirigentes?|líderes?|empresa|companhia)\b'
    travel: '\b(?:viagem|visita|estadia|estada|hospedagem|alojamento|voos?|passagens?|despesas|formação|capacitação|programa|curso|bolsa|seminário|oficina|intercâmbio)\b'
    unnamed: '^(?:os |as |o |a |seus |suas |d[oa]s? |pel[oa]s? |um |uma )?(?:anfitri(?:ões|ão|ã|ãs)|organizador(?:es|a|as)?|comitê organizador|comissão organizadora|país anfitrião|governo anfitrião|patrocinador(?:es)?|um governo)\b'
    state_hosts:
      - '\b(?:governo|autoridades|embaixada|consulado|chancelaria|ministério das relações exteriores|Estado) (?:chin(?:ês|esa|eses|esas)|d[ae] (?:República Popular d[ae] )?China)\b'
      - '\b(?:Associação (?:de Diplomacia Pública da China|Chinesa de Diplomacia Pública)|Associação de Jornalistas (?:de toda a )?(?:da )?China|Centro de Imprensa China[- ](?:América Latina|África)(?: e Caribe)?|Centro Internacional de Comunicação de Imprensa da China)\b'
    triggers: [convit, "a expensas", financiad, pag, custead, patrocinad, cobert, bancad, oferecid, particip, organizad]
    anchors:
      - id: pt_convite
        regex: '\b(?:(?:a|por|sob) convite|(?:como|na qualidade de) convidad[oa]s?|convidad[oa]s?|a expensas)\s+(?:d[aoe]s?\s+|pel[ao]s?\s+|por\s+)'
        host: after
        tail_ok: true
        note: A jornalista viajou à China a convite de ..., o repórter viajou a convite da ...
      - id: pt_viagem_paga
        regex: '\b(?:viagem|visita|estadia|estada|hospedagem|alojamento|voos?|passagens?|despesas)\b[^.!?\n]{0,60}?\b(?:foi|foram|é|são|tem sido|era|eram)\s+(?:(?:totalmente|parcialmente|integralmente)\s+)?(?:financiad[oa]s?|pag[ao]s?|custead[oa]s?|organizad[oa]s?|patrocinad[oa]s?|cobert[oa]s?|oferecid[oa]s?|bancad[oa]s?)\s+(?:pel[ao]s?|por)\s+'
        host: after
        tail_ok: true
        note: A viagem foi custeada pela ..., as despesas foram pagas por ...
      - id: pt_capacitacao
        regex: '\b(?:participou|participa|participava|foi bolsista)\s+(?:d[aoe]s?|em|no|na|nos|nas)\s+(?=[^.!?\n]{0,100}?\b(?:programa|curso|capacitação|seminário|oficina|bolsa|intercâmbio|centro de imprensa)\b)'
        host: after
        tail_ok: false
        note: O autor participou do programa do Centro de Imprensa China-América Latina.

  it:
    self: '\b(?:l[''’](?:autore|autrice|inviat[oa])|(?:il|la|questo|questa|nostr[oa]) (?:giornalista|cronista|inviat[oa]|corrispondente|reporter|fotografo)|(?:questo articolo|questo reportage|questa inchiesta|questo servizio))\b'
    label: '(?:nota della redazione|trasparenza|ndr|avvertenza|precisazione)\s*[:.)]'
    not_subject: '\b(?:presidente|premier|primo ministro|ministr[oa]|delegazione|delegati|re|regina|squadra|nazionale|giocatori|funzionari|governatore|sindac[oa]|senatore|ambasciatore|cancelliere|deputati|studenti|atleti|dirigenti|leader|azienda|società)\b'
    travel: '\b(?:viaggio|visita|soggiorno|trasferta|alloggio|voli?|spese|formazione|corso|programma|borsa|seminario|scambio)\b'
    unnamed: '^(?:gli |i |il |la |l[''’]|degli |dei |del |della |dell[''’]|dagli |dai |dal |dalla |dall[''’]|un |una )?(?:organizzator[ie]|padron[ei] di casa|ospit[ei]|comitato organizzatore|paese ospitante|governo ospitante|sponsor|un governo)\b'
    state_hosts:
      - '\b(?:governo|autorità|ambasciata|consolato|ministero degli (?:affari )?esteri|Stato) (?:cines[ei]|della (?:Repubblica Popolare )?Cinese|della Cina)\b'
      - '\b(?:Associazione (?:cinese per la diplomazia pubblica|dei giornalisti cinesi)|Centro internazionale di comunicazione stampa (?:della )?Cina)\b'
    triggers: [invito, ospit, "a spese", finanziat, pagat, offert, organizzat, sponsorizzat, sostenut, partecip]
    anchors:
      - id: it_invito
        regex: '\b(?:(?:su|dietro) invito|(?:come|in qualità di) ospit[ei]|ospit[ei]|a spese)\s+(?:d(?:i|el|ella|ello|ell[''’]|egli|ei|elle)\b\s*)'
        host: after
        tail_ok: true
        note: L'inviato ha viaggiato in Cina su invito di ..., ospite della ...
      - id: it_viaggio_pagato
        regex: '\b(?:viaggio|visita|soggiorno|trasferta|alloggio|voli?|spese)\b[^.!?\n]{0,60}?\b(?:è stat[oa]|sono stat[ie]|era|erano|è|sono)\s+(?:(?:interamente|parzialmente|in parte)\s+)?(?:finanziat[oaie]|pagat[oaie]|offert[oaie]|organizzat[oaie]|sponsorizzat[oaie]|sostenut[oaie]|copert[oaie])\s+(?:d(?:a|al|alla|allo|all[''’]|agli|ai|alle)\b\s*)'
        host: after
        tail_ok: true
        note: Il viaggio è stato organizzato dall'...; le spese sono state sostenute da ...
      - id: it_formazione
        regex: '\b(?:ha partecipato|partecipava|partecipa|ha preso parte|era borsista)\s+(?:a|al|alla|allo|all[''’]|ai|agli|alle)\s*(?=[^.!?\n]{0,100}?\b(?:programma|corso|formazione|seminario|borsa|scambio|centro stampa)\b)'
        host: after
        tail_ok: false
        note: La giornalista ha partecipato al programma di formazione organizzato da ...

  de:
    self: '\b(?:der|die|des|unser\w*) (?:Autor\w*|Reporter\w*|Journalist\w*|Korrespondent\w*|Fotograf\w*)\b|\bdiese[rsn]? (?:Artikel|Beitrag|Bericht|Reportage|Recherche|Text|Serie)\b'
    label: '(?:Transparenzhinweis|Hinweis der Redaktion|Offenlegung|Hinweis in eigener Sache|Hinweis|Anmerkung der Redaktion)\s*[:.]'
    not_subject: '\b(?:Präsident\w*|Kanzler\w*|Minister\w*|Premier\w*|Delegation|Delegierte\w*|König\w*|Mannschaft|Team|Spieler\w*|Beamte\w*|Gouverneur\w*|Bürgermeister\w*|Senator\w*|Botschafter\w*|Abgeordnete\w*|Studierende\w*|Studenten|Athlet\w*|Unternehmen|Firma)\b'
    travel: '\b(?:Reise\w*|Pressereise|Recherchereise|Aufenthalt\w*|Unterkunft|Übernachtung\w*|Flüge?|Flug\w*|Kosten|Teilnahme|Fortbildung|Schulung|Programm\w*|Seminar\w*|Stipendium|Austausch\w*|Besuch\w*)\b'
    unnamed: '^(?:de[rmns] |die |seine[mnrs]? |ihre[mnrs]? |eine[mnrs]? )?(?:Gastgeber\w*|Veranstalter\w*|Organisator\w*|Sponsor\w*|Gastland\w*|Ausrichter\w*|einladenden \w+|Regierung)\b'
    state_hosts:
      - '\b(?:chinesische[nmrs]?|Chinas) (?:Regierung|Botschaft|Generalkonsulat\w*|Konsulat\w*|Außenministerium\w*|Staat\w*|Behörden)\b'
      - '\b(?:Regierung|Botschaft|Generalkonsulat\w*|Konsulat\w*) (?:der )?(?:Volksrepublik China|VR China|Chinas)\b'
      - '\b(?:Chinesische[nr]? Journalistenverband\w*|Allchinesische[nr]? Journalistenverband\w*|Chinesische[nr]? Gesellschaft für Public Diplomacy)\b'
    triggers: [Einladung, Gast, Gäste, Kosten, bezahlt, finanziert, organisiert, unterstützt, übernommen, ermöglicht, gesponsert, getragen, Teilnehmer, teilgenommen, Transparenzhinweis]
    anchors:
      - id: de_einladung
        regex: '\b(?:auf|nach) Einladung\s+|\bals Gäste?\s+(?=de[rsmn]\b|eine[rsmn]?\b|Chinas\b)|\bauf Kosten\s+'
        host: after
