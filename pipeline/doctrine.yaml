version: 2026.10.1
note: >-
  Doctrine term families for the doctrine term tracker (pipeline/doctrine.py). Each family is a set
  phrase of the Chinese state's foreign policy vocabulary. Terms follow the theme counter's syntax
  (pipeline/themes.yaml): matched on word boundaries, case insensitively, except all capital acronyms,
  which are case sensitive; a trailing or inner asterisk matches any word characters; languages under
  substring_languages match their own terms anywhere, with a space in a term matching any whitespace
  or none. Every language also uses the all and en lists. Text is normalised before matching (Unicode
  NFC, curly, angled and corner quotation marks to straight ones, in the terms as in the text, Romanian comma letters to the cedilla letters Turkish uses),
  Occurrences are counted, overlapping matches
  once. A match overlapping an exclude phrase is dropped. An acronym counts only when a full term of
  the same family appears in the same article, and an acronym under requires only with one of its own
  full terms. Every foreign form is a rendering published by Chinese state media (Xinhua, People's
  Daily, CGTN, China Daily) or the Chinese foreign ministry and its embassies in that language, with
  the page it was checked on in a comment; a language is left out of a family when no such rendering
  was found. Hindi and Dutch have no local forms yet, so articles in them are matched on the all and
  English terms only. Changing any term bumps version (and adds an entry to HISTORY in
  pipeline/doctrine.py), and every article is tagged again at the next export.
language_aliases:
  ms: id
substring_languages:
- ja
- ko
- th
- zh
- fa
- hi
# The languages with local theme lists (pipeline/themes.yaml); the doctrine terms cover the same set.
languages: [ar, de, en, es, fa, fr, hi, id, it, ja, ko, nl, pl, pt, ro, ru, th, tr, vi]
