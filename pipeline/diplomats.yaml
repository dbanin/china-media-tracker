# Maintained list of Chinese diplomatic personnel used by the authored-by-state
# signature group. An author field that matches a name here, together with a
# diplomatic title regex anywhere in the author field, head or tail of the
# piece, is a strong Category A signature. Names alone are not enough, because
# a reporter can share a name with a diplomat.
#
# Keep this current. Each entry: name (as printed in Latin script), post, note.
# Postings change; a stale entry only weakens recall, it does not create false
# positives, because the title regex must also fire.
#
# Source for updates: fmprc.gov.cn mission lists, embassy websites.
personnel:
