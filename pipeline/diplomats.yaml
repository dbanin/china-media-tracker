# Maintained list of Chinese diplomatic personnel used by the authored-by-state
# signature group. A name is matched whole, between word boundaries, or as it
# stands in a script written without spaces. It is never matched inside a
# hyphenated or longer name: "Wang Yu" is not found in "Wang Yu-ting", nor
# "Chen Li" in "Yu-chen Li".
#
# A listed name in the author field is a strong state origin signature
# (diplomat_list_author) only when a diplomatic title describes that person and
# makes them China's diplomat. The title can be in the author field itself; on
# the byline line at the top of the body naming the same person; in a bio line
# in the head, tail or page labels that names the same person or speaks of the
# author ("Xiao Qian is the Chinese ambassador to Australia", "The writer is the
# Chinese Ambassador to Pakistan", a "*Embajador de China en Mexico" footnote
# under an author field marked "*"); on a title line of its own directly under
# the name ("Zhang Yang" and then "Embaixador da República Popular da China em
# Cabo Verde"); or next to the name in an opinion or commentary section
# ("Chinese Ambassador Chen Daojiang"). A title found elsewhere in the head, tail
# or labels does not count (until ruleset 2026.10.1 it did).
#
# The title is China's when the words bound to it name China ("Chinese
# Ambassador", "Ambassador of the People's Republic of China", "Embajador de
# China"). China as the host country does not count, and a title that names
# another country never counts: "Li Dong, Ambassador of Singapore" and "By Li
# Dong, Ambassador of Singapore to China" do not fire. A title that names no
# country ("Ambassador") counts when its line names a Chinese embassy or
# consulate, or, for a title in the author field only, when the page labels or
# the head of the body name China.
#
# When the author field is empty, a byline line at the top of the body ("By Liu
# Jinsong, Chinese Ambassador to Australia") that names someone here with China's
# diplomatic title on the same line fires the same signature. The regex signature
# diplomat_byline_head in signatures.yaml runs the same China check on its match
# (post_check: title_is_chinese). A listed name in the author field with no such
# title is a weak signal (diplomat_list_name_only) that sends the article to the
# model, because a reporter can share a name with a diplomat. A listed name in a
# body byline with no such title fires nothing.
#
# Keep this current. Each entry: name (as printed in Latin script), post, note,
# and source (a page confirming the post; entries checked on 2026-10-12 carry one).
# native lists the same name as printed in another script, matched exactly like
# name, with native_source the page that prints it: the embassy site's page in
# that language where it has one, otherwise a news report in that language.
# Postings change; a stale entry only weakens recall.
#
# What these rules protect against: a namesake (Xiao Qian, Wang Yu, Li Dong and
# Chen Xu are common names) whose piece mentions an ambassador, whose own bio line
# gives another job, or who signs as another country's diplomat. What they do not
# protect against: a namesake whose piece names the listed diplomat with China's
# title in one of the places read above. A commentator called Wang Yu whose
# opinion piece mentions "Chinese Ambassador Wang Yu" fires, and so does a
# reporter called Wang Yu whose story opens "Wang Yu, Chinese Ambassador to
# Australia, said", because the code cannot tell that the title belongs to
# someone other than the author. A new entry with a very common name therefore
# deserves a look at the author fields it matches.
#
# Former post-holders stay listed, with "former" in post. Matching reads the name
# only, never post, so a piece signed by a diplomat who has since left the post
# still matches; a signed piece published while in post is state origin whenever
# it is collected. There are no dates: a former diplomat's byline that also
# carries China's diplomatic title matches as strongly as a serving one's.
#
# The list is part of the ruleset: a change here relabels, so bump ruleset_version
# in signatures.yaml and config.RULESET_VERSION with a CHANGELOG entry.
#
# Source for updates: fmprc.gov.cn mission lists, embassy websites.
