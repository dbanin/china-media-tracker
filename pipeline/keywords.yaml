# Regular expressions applied verbatim, case sensitive, to every language.
# Plain "Sino" is the Spanish and Italian conjunction, so it must be the
# English prefix form: Sino-American, Sino-Russian.
regex:
  Sino-: 'Sino-[A-Z]'

# Terms ignored for outlets based in the territory they name. A Hong Kong
# newspaper's local news is not coverage of China for this study; without this
# almost every item from those outlets passed the gate.
home_terms:
  HKG: [Hong Kong, Hongkong, 香港, 홍콩, Hồng Kông, HKSAR, HKTDC, HKTB, HKUST, CUHK]
  MAC: [Macau, Macao, 澳門, 澳门, 마카오]
  TWN: [Taiwan, Taïwan, 台灣, 台湾, 대만, Đài Loan]

# Phrases removed before matching for outlets in the country they are listed under. The same
# problem as home_terms from the other direction: Singapore and Malaysia have large Chinese
# communities, and their domestic coverage of those communities ("Chinese New Year", "Malaysian
# Chinese Association") is not coverage of China. Only the phrase is removed; any other China
# term in the item still counts. Other countries with the same pattern can be added here.
home_phrases:
  SGP: [Chinese New Year, Chinese community, Chinese communities, ethnic Chinese, Chinese Singaporean, Chinese Singaporeans,
        Singaporean Chinese, Singapore Chinese, Chinese Development Assistance Council, Singapore Chinese Chamber of Commerce and Industry,
        Chinese clan, Chinese clans, Chinese clan associations, Chinese temple, Chinese temples, Chinese opera, Chinese-language,
        Chinese language, Chinese school, Chinese schools, Chinese-medium, Chinese Heritage Centre, Chinese Garden, Chinese cuisine,
        Chinese New Year's Eve, Chinese Chamber of Commerce]
  MYS: [Chinese New Year, Chinese community, Chinese communities, ethnic Chinese, Malaysian Chinese, Chinese Malaysian, Chinese Malaysians,
        Malaysian Chinese Association, Chinese voters, Chinese-majority, Chinese-language, Chinese language, Chinese school, Chinese schools,
        Chinese vernacular schools, Chinese-medium, Chinese independent schools, Chinese education, Chinese clan, Chinese clans,
        Chinese clan associations, Chinese temple, Chinese temples, Chinese Assembly Hall, Chinese Chamber of Commerce, Chinese cuisine,
        Tahun Baru Cina, masyarakat Cina, kaum Cina, etnik Cina, sekolah Cina, sekolah jenis kebangsaan Cina, pengundi Cina, persatuan Cina]

# Terms read only when the gate has nothing but a title: gate.check with title_only, used for the
# entries of a Google News sitemap (pipeline/news_sitemap.py), which carry no summary. Where a
# summary says "China", a headline names the city, the company, the fair or the state media brand
# that issued the item, and on its title alone the keyword gate passed 103 of PR Newswire's 210 past
# state origin releases. These names are too narrow for the main lists, which also read every
# summary. Matched like the main lists (word boundaries; terms of three characters or fewer, and
# those under capitalised, keep their case); "all" applies to every language, and a language's own
# list and the English one as for the main lists. Each hit is recorded as "title_only:<term>" among
# the gate terms. On stored titles (2026-10-12 snapshot) the block raised title-only recall of PR
# Newswire's state origin releases from 103 to 145 of 210 and admitted 3 more of its 229 items that
# were labelled not relevant. Company names were kept only where, over every stored title, the
# items they alone would admit were at least as often about China as not: car, phone, appliance,
# solar and drug makers (Geely, Chery, Xiaomi, Hisense, Sungrow, Innovent and the like) were mostly
# product news labelled not relevant and are left out, as are Serbian forms used mostly for the
# Beijing tennis tournament (Pekinga) and for athletes (Kinez, Kinezi).
