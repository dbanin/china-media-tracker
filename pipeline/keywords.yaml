# Languages whose own script is matched as a plain substring, because they write without
# spaces or attach grammar directly to the noun. Korean joins its particles to the noun with
# no space, so a word boundary missed every inflected mention: "중국 경제가" matched while
# "중국의 경제가", "중국은 대만과" and "베이징에서" did not. Latin script terms keep their
# boundary and their case rule in these languages all the same, so "Xi" does not match inside
# "Taxi" nor "BRI" inside "British".
no_word_boundaries:
  - ja
  - ko
  - th
  - km
  - lo
  - my
  - zh

# Terms that only count when another term also matches. Alone they mostly
# flag consumer technology and camera stories, not China coverage.
weak:
  - TikTok
  - ByteDance
  - Huawei
  - BYD
  - Alibaba
  - Tencent
  - Sinopec
  - Mainland
  - CCTV
  # Korean is matched as a substring from gate 2026.09.7, because its particles attach to the
  # noun. Two of its terms have common homographs inside longer words, so they corroborate
  # rather than admit: 신장 is Xinjiang but also a kidney, 신장장애 a disability and 신장하다 to
  # grow, and 중공 is the Communist Party but sits inside 중공업, heavy industry, which is most
  # of Korean shipbuilding coverage.
  - 신장
  - 중공

# Terms that count only when their first letter is capitalised, whatever their length. The rest
# of the term stays case blind, so an all-capitals headline still matches. "Kina", "Kine" and
# "Kini" are China in Croatian, Serbian and Bosnian and also the genitive and plural of "kino",
# a cinema (and the word for quinine), so the lowercase forms filled the corpus with film
# listings: "Raspored kina u Zagrebu" and "U kina stize novi film" both passed the gate, and 86
# percent of the Croatian items turned out not relevant. The country is a proper noun, so
# sentence initial and all-capitals uses of it are unaffected.
capitalised:
  - Kina
  - Kine
  - Kini
  - Кина
  # Accusative and instrumental of Kina, in the sr, hr and bs lists and under title_only (below); also cases of kino.
  - Kinu
  - Kinom
  - Кину
  - Кином
  # Genitive and dative of Кина in the sr and bs lists, and of кино as well.
  - Кине
  - Кини

# Sports sections, from gate 2026.10.1. An item whose URL path has one of these segments (the
# final segment, the article's own slug, is not read) needs more than one China term found only
# in its feed summary: a term in the headline, or two distinct terms, or one of the state media
# names under admit_alone. Sports summaries name China in passing (a draw, a venue, an opponent,
# "Djokovic in Beijing"), and over 2026-09-03 to 2026-10-12 the keyword gate admitted 1,125 such
# items that were then fetched and found not relevant, against 219 independent journalism labels
# and no state origin or unchecked state sourcing label. Lifestyle, travel and
# entertainment paths are deliberately not listed: state promotional features run there (a
# Xinhua-sourced bridge feature in a lifestyle magazine is unchecked state sourcing), and a single
# term in their summaries still admits.
sports_sections:
  segments: [sport, sports, deportes, deporte, esportes, esporte, polideportivo, tenis, tennis, futbol, futebol,
