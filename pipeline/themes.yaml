# Themes 2026.10.1, added for the owner's request of 2026-10-28. The three themes below use the shared
# matcher (pipeline/termlists.py; pipeline/themes.py _ruled_matcher): terms under exclude never count; an
# acronym counts only beside a full term of its own list; a near rule counts one of its terms only when a
# term of every context list lies within window characters of it and no avoid term does. Every term was
# read at least once in its own language (all and en: in English) in the relevant articles of the tracked
# outlets in the snapshot of 2026-10-28 (titles, feed summaries and the bodies on file); a candidate form
# not seen there was left out, never translated in. The forms left out are listed in the round's changelog.
# Leaving the Belt and Road: a name of the initiative with a word of leaving, exiting or not renewing within
# 80 characters (Italy's exit in 2023, Panama's in 2025, Colombia's debate in 2026). "back out" and "quit*"
# were dropped (heading back out on the road; quite); 불참 too, which is skipping a forum, not leaving.
- id: bri_withdrawal
  label: Leaving the Belt and Road
  short: BRI exit
  terms: {}
  near:
  - window: 80
    terms:
      all: [Belt and Road, BRI, One Belt One Road, OBOR, New Silk Road]
      es: [Franja y la Ruta, Nueva Ruta de la Seda, Ruta de la Seda]
      fr: [Nouvelles routes de la soie, Nouvelle route de la soie, routes de la soie, route de la soie, la Ceinture
          et la Route]
      pt: [Cinturão e Rota, Nova Rota da Seda, Rota da Seda]
      it: [Via della Seta, Nuova Via della Seta]
      de: [Seidenstraße, Seidenstrasse]
      ru: [Пояс и путь, Пояса и пути, Один пояс, Шелков* пут*]
      ar: [الحزام والطريق, طريق الحرير]
      ko: [일대일로]
      ja: [一帯一路]
      vi: [Vành đai và Con đường, Con đường tơ lụa]
      id: [Sabuk dan Jalan]
      tr: [Kuşak ve Yol, İpek Yolu]
      ro: [Drumul Mătăsii]
      pl: [Pasa i Szlaku]
      fa: [کمربند و جاده, جاده ابریشم]
      hi: [बेल्ट एंड रोड]
      th: [เส้นทางสายไหม]
    context:
    - en: [withdraw*, withdrawal, withdrew, exit*, pull out, pulls out, pulled out, pulling out, leave the, leaves
          the, leaving the, left the, not renew*, not to renew, non-renewal, abandon*, ditch*, drop out, dropped
          out, drops out, scrap*, step away, walk away, walked away, terminate*, terminating]
      es: [retir*, salida, salir*, sale de, abandon*, no renovar*, deja la, dejó la]
      fr: [retrait, retir*, sortie, sortir, sort de, quitt*, abandon*, renonc*]
      pt: [retirada, retir*, saída, sair*, deixar*, deixa a, deixou a, abandon*]
      it: [uscita, uscire, uscit*, esce, abbandon*, ritir*, addio]
      de: [verlass*, kündig*]
      ru: [выход*, выйти, выходит, вышла, вышел, вышли, отказ*, покида*, покинул*, покинуть]
      ar: [انسحاب, الانسحاب, ينسحب, تنسحب, انسحبت, الخروج, خروج, التخلي]
      ko: [탈퇴, 이탈, 철회, 연장하지 않, 탈피]
      ja: [離脱, 撤退]
      vi: [rút khỏi, rút lui, từ bỏ, rời khỏi, ra khỏi]
      id: [keluar dari, mundur dari, menarik diri, meninggalkan, keluar]
      tr: [çekil*, ayrıl*, çıkış*, çıkma*, yenileme*]
      nl: [terugtrekken, trekt zich terug, verlaten, verlaat, verliet]
