# 2026.10.1 (2026-10-28): three themes added at the end, crossed with outlet leaning on the site (leaning_cross).
# The eleven earlier themes are unchanged, so their tags do not change; history is re-tagged newest first
# within each export's time budget (pipeline/themes.py BODY_RETAG_SECONDS).
# 2026.10.2 (2026-10-29): the three themes' terms corrected after a check of every hit in the snapshot and the
# runner's audit files (misfires and misses listed in the comments of each theme); the eleven earlier themes
# unchanged again. History is re-tagged newest first as for 2026.10.1.
version: 2026.10.2
note: Theme terms for the theme counter. An article carries every theme whose terms appear in its title, feed summary or anywhere in its body (only the first 800 characters before 2026.09.4); an article with none is Other. Terms are matched on word boundaries, case-insensitively, except all-capital acronyms, which are case sensitive. A trailing or inner asterisk matches any word characters. Languages under substring_languages match terms anywhere, because words there are not separated by spaces or carry attached particles. Every language also uses the all and en lists, as the relevance gate does. Changing any term bumps version, and every article is re-tagged, newest first, over the next exports within each export's time budget; until then an article keeps its older tag. Since 2026.10.1 a theme may also carry exclude and near rules (see the three themes at the end).
