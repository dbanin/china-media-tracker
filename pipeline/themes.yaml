# Chinese overcapacity and dumping: overcapacity and overproduction words anywhere; anti-dumping words, and the
# English dumping with a trade word, only beside a word of Chinese origin (Chinese, from China, 중국산, aus
# China) and never beside a nuclear, waste or retaliation word (the dumping of Fukushima water; China's own
# probes into EU brandy, pork and dairy belong to the EU and China trade war); a flood, influx or wave of goods
# beside cheap, low cost or subsidised and a China word, within 60 characters; the Korean supply glut words
# (공급과잉) only within 60 characters of 중국 or 中. "dumped" was dropped (dumped out of the Shanghai Masters),
# 밀어내기 too (a volleyball push, an export push before a holiday). Known misfire: an anti-dumping probe China
# itself opens, when a Chinese word stands near it.
- id: overcapacity
  label: Chinese overcapacity and dumping
  short: Overcapacity
  terms:
    en: [China shock]
    es: [shock chino]
    fr: [choc chinois]
    pt: [choque chinês]
    it: [shock cinese]
    de: [China-Schock*]
    nl: [China-schok]
    pl: [chiński szok]
    ko: [차이나 쇼크]
  exclude:
    ar: [السوق الصينية, الأسواق الصينية]
  near:
  - window: 120
    terms:
      en: [dumping]
    exclude:
      en: [dumping ground*, illegal dumping, industrial dumping]
    context:
    - en: [Chinese, from China, China-made, Chinese-made, made in China]
      es: [chinos, chinas, chino, procedentes de China, de origen chino, made in China]
      fr: [chinois, chinoises, chinoise, en provenance de Chine, made in China]
      pt: [chineses, chinesas, chinês, chinesa, provenientes da China, da China, made in China]
      it: [cinesi, cinese, dalla Cina, made in China]
      de: [chinesisch*, aus China, Made in China]
      ru: [китайск*, из Китая, из КНР]
      ar: [الصينية, الصيني, صينية, من الصين]
      ko: [중국산, 중국발, 중국 제품, 중국 철강, 中철강]
      ja: [中国製, 中国からの]
      vi: [từ Trung Quốc, của Trung Quốc]
      id: [dari China, asal China, buatan China, produk China, impor China, dari Tiongkok, asal Tiongkok]
      tr: [Çin'den, Çin menşeli, Çin üretimi]
      nl: [Chinese, uit China]
      ro: [chinezești, chinezesc, chinezeşti, din China]
      pl: [chińsk*, z Chin]
      fa: [چینی]
      hi: [चीन से, चीनी सामान]
      th: [จากจีน, สินค้าจีน, ของจีน]
    - en: [imports, exports, goods, products, steel, prices, market, markets, tariff*, duties, subsidi*, cheap*,
        vehicles, cars, solar, overcapacity, trade, manufactur*, industr*]
    avoid:
      all: [Fukushima]
      en: [nuclear, radioactive, wastewater, waste water, treated water, contaminated water, sewage, waste, garbage,
        trash, toxic, sludge, ocean, into the sea, brandy, cognac, pork, dairy, canola, rapeseed, POM, environment*,
        China launches, China launched, China opens, China imposes, China imposed, China's commerce ministry, imports
