# Personas and false fronts named in published investigations as having placed or pitched
# articles in real news outlets. Every entry carries the public report URL that names it.
# A match in the tracker means only that a byline or cited organisation matches a name on
# this list. The tracker cannot prove a byline is fictitious. Nothing here comes from memory.
# Bump version on every change; the pipeline rescans everything when it changes.
version: "2026.10.1"

operations:
  - id: openai_bogus_bylines_2026
    name: Bogus Bylines
    origin: IR
    reported_by: OpenAI
    report_url: https://openai.com/index/disrupting-ai-enabled-false-front-operations/
    reported_on: "2026-10-08"
    summary: >-
      Iran-origin operation that used seven invented journalist bylines to pitch long-form
      articles about the US-Iran conflict to small and medium online outlets. OpenAI identified
      almost 100 articles published or syndicated under the bylines across roughly a dozen
      outlets between July 2025 and October 2026 and assessed the activity as consistent with a
      for-hire commercial actor. NPR, citing NBC News, reported that Middle East Monitor
      published at least 21 articles by four of the personas and that one persona posted in the
      Daily Kos community section. The outlets were deceived and are not fronts.

  - id: openai_dark_clark_2026
    name: Dark Clark
    origin: RU
    reported_by: OpenAI
    report_url: https://openai.com/index/disrupting-ai-enabled-false-front-operations/
    reported_on: "2026-10-08"
    summary: >-
      Russia-origin operation targeting Latin America that controlled a self-styled research
      platform, the Social Research Center, through a fake persona named Mia Clark, and
      claimed to have planted fake stories in Peruvian, Polish, Ecuadorian and Bolivian media.
      OpenAI assessed it at Category 5 on the IO Breakout Scale and tied parts of it to reporting
      on the Russian entity known as Politology or La Compania.

  - id: openai_precedent_alice_donovan_2017
    name: Alice Donovan (precedent)
    origin: RU
    reported_by: OpenAI
    report_url: https://openai.com/index/disrupting-ai-enabled-false-front-operations/
    reported_on: "2026-10-08"
    summary: >-
      Precedent named in the OpenAI report of 8 October 2026: the fake journalist Alice Donovan,
      a front for Russian military intelligence whose articles were published by a range of
      Western outlets in 2016 and 2017. The persona ceased activity after exposure.

  - id: peacedata_2020
    name: PeaceData
    origin: RU
    reported_by: NBC News, citing Facebook and Graphika
    report_url: https://nbcnews.com/tech/tech-news/russian-internet-trolls-hired-u-s-journalists-push-their-news-n1239000
    reported_on: "2020-09-01"
    summary: >-
      Fake news outlet Peace Data, run by people formerly associated with the Russian Internet
      Research Agency according to Facebook, which recruited unwitting freelance writers through
      fictional editor personas. Also named as a precedent in the OpenAI report of 8 October 2026.

  - id: daily_beast_iran_arabic_bylines_2021
    name: Iran-linked Arabic bylines
    origin: IR
    reported_by: The Daily Beast
    report_url: https://www.thedailybeast.com/pro-iran-trolls-planted-dozens-of-bogus-stories-on-legit-news-sites/
    reported_on: "2021-01-12"
    summary: >-
      The Daily Beast reported that three fictitious journalists published articles in dozens of
      periodicals and news websites since May 2019, and that Facebook attributed the amplification
      to trolls based in Iran using fake accounts. Meta's December 2020 Coordinated Inauthentic
      Behavior report (https://about.fb.com/news/2021/01/december-2020-coordinated-inauthentic-behavior-report/)
      lists a small Iran network found after reviewing information from FireEye and The Daily
      Beast and notes networks that targeted traditional media to place stories under fictitious bylines.

  - id: mandiant_haienergy_2022
    name: HaiEnergy
    origin: CN
    reported_by: Mandiant
    report_url: https://cloud.google.com/blog/topics/threat-intelligence/pro-prc-information-operations-campaign-haienergy
    reported_on: "2022-08-04"
    summary: >-
      Pro-PRC information operation using at least 72 suspected inauthentic news sites, which
      Mandiant linked by technical indicators to Shanghai Haixun Technology Co., Ltd, a Chinese
      public relations firm. Mandiant did not establish the extent of Haixun's knowledge of the
      campaign and did not attribute it directly to the PRC government.

  - id: mandiant_haienergy_2023
    name: HaiEnergy newswires and US news subdomains
    origin: CN
    reported_by: Mandiant
    report_url: https://cloud.google.com/blog/topics/threat-intelligence/pro-prc-haienergy-us-news
    reported_on: "2023-07-24"
    summary: >-
      Follow-up report finding HaiEnergy content distributed through two self-described press
      release services, Times Newswire and World Newswire, and placed on at least 32 subdomains
      of legitimate US news outlets that resolved to infrastructure of FinancialContent, Inc.
      Mandiant saw no evidence that the affected outlets were compromised and did not establish
      a technical connection between Haixun and the newswires.

  - id: citizenlab_paperwall_2024
    name: Paperwall
    origin: CN
    reported_by: Citizen Lab
    report_url: https://citizenlab.ca/2024/02/paperwall-chinese-websites-posing-as-local-news-outlets-with-pro-beijing-content/
    reported_on: "2024-02-07"
    summary: >-
      Network of at least 123 websites in 30 countries posing as local news outlets and mixing
      pro-Beijing content and attacks on critics into commercial press releases. Citizen Lab
      attributed the network to Shenzhen Haimaiyunxiang Media Co., Ltd., known as Haimai, on the
      basis of infrastructure links, and published the full list of 123 domains.

  - id: google_glassbridge_2024
    name: GlassBridge
    origin: CN
    reported_by: Google Threat Intelligence Group
    report_url: https://cloud.google.com/blog/topics/threat-intelligence/glassbridge-pro-prc-influence-operations/
    reported_on: "2024-11-22"
    summary: >-
      Google described four China-based public relations and marketing firms, Shanghai Haixun
      Technology, Shenzhen Haimai Yunxiang Media, DURINBRIDGE and Shenzhen Bowen Media, running
      inauthentic news sites and newswire services that spread pro-PRC content. Google blocked
      more than a thousand of their sites from Google News and Discover since 2022 and assessed
      that the firms may take direction from a shared customer it could not identify.

  - id: meta_wilson_edwards_2021
    name: The Swiss biologist that never was
    origin: CN
    reported_by: Meta
    report_url: https://about.fb.com/wp-content/uploads/2021/12/November-2021-CIB-Report-UPDATED-stats.pdf
    reported_on: "2021-12-01"
    summary: >-
      A fake persona called Wilson Edwards, claiming to be a Swiss biologist, posted on 24 July
      2021 that the United States was pressuring WHO scientists over COVID-19 origins. Within a
      week Chinese state media including the Global Times and People's Daily ran headlines on the
      claim; the Swiss embassy in Beijing said no such citizen existed. Meta linked the operation
      to individuals in mainland China including employees of Sichuan Silence Information
      Technology Co, Ltd and to employees of Chinese state infrastructure companies abroad.

