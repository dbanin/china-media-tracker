# State issuers of paid releases (pipeline/state_issuers.py, schema in state_issuers_schema.json).
#
# The rules (pipeline/classify_rules.py) read a paid release (a release wire dateline, an item from an
# outlet's press release, sponsored or partner section, a release wire named in the page labels or author
# field, or a SOURCE trailer) for its own issuer, named in one of five places: a header line (the headline's
# "Issuer:" prefix, or a line that is the issuer's name alone at the top or foot of the text), the dateline
# line right after the wire stamp, the SOURCE trailer, an "issued by" line, or the media contact block. A
# body named anywhere else, in a sentence of the release or of a news story, never counts. When the issuer
# is in this registry the label follows its group, with the pattern id recorded like every signature:
#
#   A  party-state issuers: central state media, provincial and city international communication centres,
#      party committees and their publicity departments, people's governments and their bureaus at every
#      level, and provincial party dailies. State origin.
#   S  state-owned enterprises and state-run institutions (state universities, state laboratories), named
#      only with a public source of state ownership. Owner decision D13 of 2026-11-24: stored, shown on
#      their own line, never in the state origin count.
#   H  Hong Kong SAR government and statutory bodies, and Macao SAR government and statutory bodies by the
#      same rule. Owner decision D14 of 2026-11-24: stored, shown on their own line, never in the state
#      origin count.
#
# Issuers the paper codes as unsettled (state museums, culture exchange centres, unnamed issuers of
# state-hosted events) are deliberately absent: they stay with the model (D13). So are bodies whose state
# ownership has no public source, private firms that are partly state held (Gree Electric since 2019), the
# Hong Kong universities, and government-owned companies of the SARs (MTR, Cyberport).
#
# Every entry carries a public source showing the body is party-state (or state-owned for S, or a SAR
# government or statutory body for H). The sources were looked up on 2026-11-24.
#
# Fields:
#   id           stable identifier, never reused
#   group        A, S or H
#   kind         what sort of body (central_state_media, international_communication_centre,
#                publicity_department, party_committee, government, party_daily, state_owned_enterprise,
#                state_institution, sar_body)
#   issuer_type  the issuer type stored on the label (classify_llm.ISSUER_TYPES): A takes state_media,
#                government, party or diplomatic; S always state_owned_enterprise; H always sar_government
#   names        exact names and aliases, matched as whole words and as written, or wholly in capitals
#                (a headline set in capitals); a lower case word never matches a name ("China mobile
#                gaming" is not China Mobile)
#   patterns     generic name forms (regex). {place} stands for any place in places (a Chinese province,
#                autonomous region, municipality or city; never Hong Kong, Macao or Taiwan), {province} for
#                a province level name only, and {name} for one to three capitalised words, allowed only
#                beside a term no other state uses (People's Government, CPC, Communist Party of China)
#   domains      web and mail domains, read only inside a media contact block
#   china_dateline  true when a pattern needs the release's dateline line to place it in China
#   source_url, source_title, basis   the public source
version: "2026-11-24"
decided_on: "2026-11-24"

