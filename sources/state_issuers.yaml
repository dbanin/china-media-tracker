issuers:
  # ---------------------------------------------------------------- A: central state media
  - id: xinhua_silk_road
    group: A
    kind: central_state_media
    issuer_type: state_media
    names: ["Xinhua Silk Road", "Xinhua Silk Road Information Service"]
    domains: [imsilkroad.com]
    source_url: https://en.wikipedia.org/wiki/Xinhua_News_Agency
    source_title: Xinhua News Agency (Wikipedia)
    basis: Xinhua Silk Road is the release service of Xinhua's China Economic Information Service; Xinhua is the state press agency.
  - id: xinhua_finance
    group: A
    kind: central_state_media
    issuer_type: state_media
    names: ["Xinhua Finance", "Xinhua Finance Agency"]
    domains: [cnfin.com]
    source_url: https://en.wikipedia.org/wiki/Xinhua_News_Agency
    source_title: Xinhua News Agency (Wikipedia)
    basis: Xinhua Finance is Xinhua's financial information service; Xinhua is the state press agency.
  - id: xinhuanet
    group: A
    kind: central_state_media
    issuer_type: state_media
    names: ["Xinhuanet", "Xinhua Net", "Xinhua News Agency"]
    domains: [news.cn, xinhuanet.com]
    source_url: https://en.wikipedia.org/wiki/Xinhuanet
    source_title: Xinhuanet (Wikipedia)
    basis: Xinhuanet is the website of Xinhua, the state press agency.
  - id: cgtn
    group: A
    kind: central_state_media
    issuer_type: state_media
    names: ["CGTN", "China Global Television Network"]
    domains: [cgtn.com]
    source_url: https://en.wikipedia.org/wiki/CGTN
    source_title: CGTN (Wikipedia)
    basis: CGTN is the international arm of China Media Group, the state broadcaster under the CPC Central Committee's publicity department.
  - id: china_media_group
    group: A
    kind: central_state_media
    issuer_type: state_media
    names: ["China Media Group", "China Central Television", "CCTV", "China Radio International", "CRI Online", "CRIOnline"]
    domains: [cctv.com, cri.cn]
    source_url: https://en.wikipedia.org/wiki/China_Media_Group
    source_title: China Media Group (Wikipedia)
    basis: China Media Group, which holds CCTV and China Radio International, is the state broadcaster directly under the CPC Central Committee's publicity department.
  - id: peoples_daily
    group: A
    kind: central_state_media
    issuer_type: state_media
    names: ["People's Daily", "People's Daily Online", "People's Daily Online Australia", "People.cn", "Haiwai.net", "Haiwainet", "People's Daily Overseas Edition"]
    domains: [people.cn, people.com.cn, haiwainet.cn]
    source_url: https://en.wikipedia.org/wiki/People%27s_Daily
    source_title: People's Daily (Wikipedia)
    basis: People's Daily is the official newspaper of the CPC Central Committee; People's Daily Online, its Australian edition and Haiwai.net (the Overseas Edition's site) are its outlets.
  - id: global_times
    group: A
    kind: central_state_media
    issuer_type: state_media
    names: ["Global Times", "Global Times Online"]
    domains: [globaltimes.cn]
    source_url: https://en.wikipedia.org/wiki/Global_Times
    source_title: Global Times (Wikipedia)
    basis: The Global Times is a daily published by People's Daily.
  - id: china_daily
    group: A
    kind: central_state_media
    issuer_type: state_media
    names: ["China Daily"]
    domains: [chinadaily.com.cn]
    source_url: https://en.wikipedia.org/wiki/China_Daily
    source_title: China Daily (Wikipedia)
    basis: China Daily is owned by the CPC Central Committee's publicity department.
  - id: cicg
    group: A
    kind: central_state_media
    issuer_type: state_media
    names: ["China International Communications Group", "China International Communication Group", "CICG", "China International Publishing Group", "China Report ASEAN", "Beijing Review", "China.org.cn"]
    domains: [china.org.cn, cicg.org.cn]
    source_url: https://en.wikipedia.org/wiki/China_International_Communications_Group
    source_title: China International Communications Group (Wikipedia)
    basis: CICG is the state publishing group under the CPC Central Committee; China Report ASEAN and Beijing Review are its magazines.
  - id: china_economic_net
    group: A
    kind: central_state_media
    issuer_type: state_media
    names: ["China Economic Net", "Economic Daily"]
    domains: [ce.cn]
    source_url: https://en.wikipedia.org/wiki/Economic_Daily
    source_title: Economic Daily (Wikipedia)
    basis: China Economic Net is the website of Economic Daily, a state newspaper under the CPC Central Committee.
  - id: china_news_service
    group: A
    kind: central_state_media
    issuer_type: state_media
    names: ["China News Service", "ECNS"]
    domains: [chinanews.com.cn, ecns.cn]
    source_url: https://en.wikipedia.org/wiki/China_News_Service
    source_title: China News Service (Wikipedia)
    basis: China News Service is the state news agency now under the United Front Work Department.
  - id: smg_yicai
    group: A
    kind: central_state_media
    issuer_type: state_media
    names: ["Shanghai Media Group", "SMG", "Yicai", "Yicai Global", "China Business Network", "ShanghaiEye", "Shanghai Global News Network"]
    domains: [yicai.com, yicaiglobal.com, smg.cn]
    source_url: https://en.wikipedia.org/wiki/Shanghai_Media_Group
    source_title: Shanghai Media Group (Wikipedia)
    basis: Shanghai Media Group, owner of Yicai (China Business Network), is the state broadcaster of the Shanghai municipal government.
  # ---------------------------------------------------------------- A: international communication centres
  - id: international_communication_centre
    group: A
    kind: international_communication_centre
    issuer_type: state_media
    names: ["iChongqing", "JiangsuNow", "Great Wall International Communication Center", "GWICC", "GDToday", "HolaFujian", "Hainan International Media Center"]
    patterns:
      - '{place}(?: Provincial| Municipal| City)? International Communications? Cent(?:er|re)'
      - 'International Communications? Cent(?:er|re) of (?:the )?{place}'
    source_url: https://en.wikipedia.org/wiki/International_communication_center
    source_title: International communication center (Wikipedia)
    basis: Provincial and city international communication centres are state media institutions set up by China's provinces and cities and supervised by the CPC Central Propaganda Department; the page lists iChongqing, JiangsuNow, GWICC, GDToday, HolaFujian, HIMC and the Shaanxi centre.
  - id: jxicc
    group: A
    kind: international_communication_centre
    issuer_type: state_media
    names: ["Jiangxi International Communication Center", "JXICC"]
    source_url: https://lingua-sinica.org/entity-type/international-communication-center-icc/
    source_title: International Communication Center (Lingua Sinica)
    basis: JXICC was launched in April 2024 under the Jiangxi Provincial Party Committee Propaganda Department and is operated by Jiangxi Daily.
  - id: injiangsu
    group: A
    kind: international_communication_centre
    issuer_type: state_media
    names: ["inJiangsu", "Jiangsu International Communication Center"]
    domains: [ourjiangsu.com]
    source_url: https://www.chinadaily.com.cn/a/202405/22/WS664dcf96a31082fc043c88ff.html
    source_title: Jiangsu unveils multilingual website and app for global users (China Daily)
    basis: inJiangsu is the international portal run by the Jiangsu International Communication Center of the provincial broadcaster Jiangsu Broadcasting Corporation.
  - id: iqingdao
    group: A
    kind: international_communication_centre
    issuer_type: state_media
    names: ["iQingdao", "IQingdao", "Iqingdao"]
    domains: [iqingdao.info]
    source_url: https://briefglance.com/companies/qingdao-international-community-center
    source_title: Qingdao International Community Center (BriefGlance)
    basis: iQingdao is the international platform run under Qingdao Daily, the paper of the CPC Qingdao Municipal Committee.
  # ---------------------------------------------------------------- A: party committees and publicity departments
  - id: publicity_department
    group: A
    kind: publicity_department
    issuer_type: party
    names: ["Publicity Department of the CPC Central Committee", "Central Propaganda Department"]
    patterns:
      - '(?:Publicity|Propaganda) Department of (?:the )?(?:CPC|CCP|Communist Party of China|Chinese Communist Party) {name}(?: (?:Municipal|Provincial|Prefectural|County|District|City|Regional|Autonomous Region|Autonomous Prefecture|Autonomous County|Banner))? Committee'
      - '(?:Publicity|Propaganda) Department of (?:the )?{name} (?:Municipal|Provincial|Prefectural|County|District|City|Regional) (?:Party )?Committee(?: of (?:the )?(?:CPC|CCP|Communist Party of China))?'
      - '(?:CPC |CCP )?{name} (?:Municipal|Provincial|Prefectural|County|District|City|Regional) (?:Party )?Committee(?:[’'']s)? (?:Publicity|Propaganda) Department'
      - '(?:Publicity|Propaganda) Department of (?:the )?{place}(?: City| Municipality| Province| County| District)?'
      - '{place}(?: Municipal| Provincial| City)? (?:Publicity|Propaganda) Department'
    source_url: https://en.wikipedia.org/wiki/Publicity_Department_of_the_Chinese_Communist_Party
    source_title: Publicity Department of the Chinese Communist Party (Wikipedia)
    basis: The publicity (propaganda) departments of the CPC's provincial, municipal and county committees are party organs under the Central Publicity Department.
  - id: party_committee
    group: A
    kind: party_committee
    issuer_type: party
    patterns:
      - '(?:CPC|CCP|Communist Party of China) {name} (?:Municipal|Provincial|Prefectural|County|District|City|Regional) Committee'
      - '{name} (?:Municipal|Provincial|Prefectural|County|District|City|Regional) Committee of (?:the )?(?:CPC|CCP|Communist Party of China)'
    source_url: https://en.wikipedia.org/wiki/Organization_of_the_Chinese_Communist_Party
    source_title: Organization of the Chinese Communist Party (Wikipedia)
    basis: Local committees of the CPC lead each province, city and county.
  # ---------------------------------------------------------------- A: people's governments and bureaus
  - id: peoples_government
    group: A
    kind: government
    issuer_type: government
    patterns:
      - '(?:(?:Information Office|General Office|Foreign Affairs Office)(?: of the)? )?{name}(?: (?:Municipal|Provincial|Prefectural|County|District|City|Township|Town|Autonomous Region|Autonomous Prefecture|Autonomous County|Banner))? People[’'']s Government'
      - 'People[’'']s Government of (?:the )?{name}(?: (?:Municipality|Province|City|County|District|Autonomous Region|Prefecture|Township|Town))?'
    source_url: https://en.wikipedia.org/wiki/Local_government_in_China
    source_title: Local government in China (Wikipedia)
    basis: The people's governments are the state administration of each province, city, county, district and township.
  - id: government_bureau
    group: A
    kind: government
    issuer_type: government
    names: ["State Council Information Office", "Information Office of the State Council", "Ministry of Commerce of the People's Republic of China", "Ministry of Culture and Tourism of the People's Republic of China", "Ministry of Foreign Affairs of the People's Republic of China"]
    patterns:
      - '{place} (?:Municipal|Provincial|City|County|District|Prefectural)(?: (?:[A-Z][\w&,]*|and|of|for)){0,8}? (?:Bureau|Commission|Department|Office|Administration)\b'
      - '{place}(?: (?:[A-Z][\w&,]*|and|of|for)){1,6}? (?:Bureau|Commission)\b'
      - '(?:Bureau|Department|Commission|Administration|Office) of (?:[A-Z][\w&]*|and|of|for|the)(?: (?:[A-Z][\w&]*|and|of|for|the)){0,8}?,? of (?:the )?{place}(?: (?:Municipality|Province|City|County|District|Autonomous Region))?'
      - '{place} (?:Municipal|Provincial) Government'
      - 'Government of {place}(?: (?:Municipality|Province|City|Autonomous Region))?'
    source_url: https://en.wikipedia.org/wiki/Local_government_in_China
    source_title: Local government in China (Wikipedia)
    basis: Municipal and provincial bureaus, commissions and departments are the working organs of the local people's governments.
  - id: district_bureau
    group: A
    kind: government
    issuer_type: government
    china_dateline: true
    patterns:
      - '(?:Bureau|Department|Commission|Office) of [A-Z][\w&]*(?: (?:[A-Z][\w&]*|and|of|for)){0,8},? (?:of )?(?:the )?[A-Z][a-z]+ (?:District|County)(?:,? {place}(?: City)?)?'
    source_url: https://en.wikipedia.org/wiki/Local_government_in_China
    source_title: Local government in China (Wikipedia)
    basis: District and county bureaus are the working organs of the district and county people's governments; read only on a release whose dateline places it in China.
  - id: chinese_mission
    group: A
    kind: government
    issuer_type: diplomatic
    names: ["Chinese Embassy", "Chinese Consulate General"]
    patterns:
      - '(?:Embassy|Consulate[- ]General|Consulate) of (?:the )?People[’'']s Republic of China'
      - '(?:Embassy|Consulate[- ]General) of China in [A-Z][a-z]+'
    source_url: https://en.wikipedia.org/wiki/List_of_diplomatic_missions_of_China
    source_title: List of diplomatic missions of China (Wikipedia)
    basis: Chinese embassies and consulates are missions of the Ministry of Foreign Affairs.
  # ---------------------------------------------------------------- A: provincial party dailies
  - id: party_daily
    group: A
    kind: party_daily
    issuer_type: state_media
    names: ["Dazhong Daily", "Nanfang Daily", "Jiefang Daily", "Xinhua Daily", "Changjiang Daily", "Shanghai United Media Group"]
    patterns:
      - '{province} Daily(?: (?:Press|Newspaper|Media|News) Group)?'
    source_url: https://en.wikipedia.org/wiki/Party_newspaper
    source_title: Party newspaper (Wikipedia)
    basis: Each provincial CPC committee publishes a party daily (Hubei Daily, Guizhou Daily, Dazhong Daily for Shandong, Nanfang Daily for Guangdong, Xinhua Daily for Jiangsu, Jiefang Daily for Shanghai); Changjiang Daily is the paper of the Wuhan committee.
  # ---------------------------------------------------------------- S: state-owned enterprises and state-run institutions
  - id: chery
    group: S
    kind: state_owned_enterprise
    issuer_type: state_owned_enterprise
    names: ["Chery", "Chery Automobile", "Chery Auto", "Chery International", "LEPAS", "Exeed", "Jetour", "Omoda", "Jaecoo"]
    domains: [cheryinternational.com, chery.cn, mychery.com]
    source_url: https://en.wikipedia.org/wiki/Chery
    source_title: Chery (Wikipedia)
    basis: Chery is a state-owned carmaker controlled by the Wuhu municipal government; LEPAS, Exeed, Jetour, Omoda and Jaecoo are its brands.
  - id: changan
    group: S
    kind: state_owned_enterprise
    issuer_type: state_owned_enterprise
    names: ["Changan Automobile", "Chongqing Changan Automobile", "Changan Group", "China Changan Automobile Group", "Deepal"]
    source_url: https://en.wikipedia.org/wiki/Changan_Automobile
    source_title: Changan Automobile (Wikipedia)
    basis: Changan is a central state-owned carmaker under the State Council's SASAC.
  - id: china_eastern
    group: S
    kind: state_owned_enterprise
    issuer_type: state_owned_enterprise
    names: ["China Eastern Airlines", "China Eastern", "CEAir", "China Eastern Air Holding"]
    domains: [ceair.com]
    source_url: https://en.wikipedia.org/wiki/China_Eastern_Airlines
    source_title: China Eastern Airlines (Wikipedia)
    basis: China Eastern Airlines is controlled by China Eastern Air Holding, a central state-owned enterprise.
  - id: shanghai_electric
    group: S
    kind: state_owned_enterprise
    issuer_type: state_owned_enterprise
    names: ["Shanghai Electric", "Shanghai Electric Group"]
    source_url: https://en.wikipedia.org/wiki/Shanghai_Electric
    source_title: Shanghai Electric (Wikipedia)
    basis: Shanghai Electric is a state-owned enterprise of the Shanghai municipal government.
  - id: baic
    group: S
    kind: state_owned_enterprise
    issuer_type: state_owned_enterprise
    names: ["BAIC", "BAIC Group", "BAIC Motor", "Beijing Automotive Group", "Foton", "Foton Motor", "BAIC Foton"]
    source_url: https://en.wikipedia.org/wiki/BAIC_Group
