# Syndication deals: publicly announced agreements between outlets and Chinese state media, read by
# pipeline/syndication.py. Report only: an entry never changes a label, a count or the outlets monitored.
# The shape is in sources/syndication_schema.json; check the file with
#   python -m pipeline.syndication validate [path]
#
# Each entry:
#   id                 a unique slug
#   outlet_id          an id in sources/outlets.yaml, or unmonitored: true with outlet_name
#   partner            xinhua, cgtn, china_daily, global_times, peoples_daily, cri, cns, cmg or other
#                      (other: provincial or municipal state media, or another central body, named in notes)
#   kind               content_exchange, news_exchange, mou, cooperation_agreement, supplement,
#                      paid_placement, joint_venture, training_partnership or other
#   signed_on          YYYY-MM-DD, YYYY-MM or YYYY, with precision day, month or year to match
#   effective_from, ended_on   optional, in the same forms
#   source_url         a public https page that states the deal and its date (required)
#   source_title, source_publisher, source_kind (primary, news_report, ngo_report, academic), accessed_on
#   confidence         stated (a party announced it) or reported (a third party reported it)
#   notes, verified_by optional
#   verification       the source check: status (verified, source_moved or unverified), checked_on, the
#                      page_date the page gives for the signing, a note, and previous_url (source_moved)
#                      or archived_url (read from an archived copy). A check of sources, not a hand check.
# Entries researched 2026-10-13 from public pages only (51; 47 predate collection). Every source was
# re-read on 2026-10-28: 50 verified, 1 source moved, none unverified or contradicted.
