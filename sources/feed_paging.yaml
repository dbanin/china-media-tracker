- feed: https://www.mk.ru/rss/news/index.xml
  type: page
  page1: https://www.mk.ru/news/
  pages: https://www.mk.ru/news/{n}/
  first: 1
  max_pages: 3
  links: '^https://www\.mk\.ru/[a-z-]+/\d{4}/\d{2}/\d{2}/[^/]+\.html$'
  verified: '2026-11-18'
  evidence: The feed lists 75 items, about 19 of them on www.mk.ru and the rest on the regional editions
    (yar.mk.ru and others). /news/ lists the www items newest first, about 145 a page, with the feed's www items
    at its head in the feed's order; /news/2/ and /news/3/ each listed about 140 older ones. Every page closes
    with the same 29 older links (a side column, about a sixth of the page, under the half that stops the
    reading), which are usually on record, so the reading ends after the first page with its links added. The
    listing closes the gap for www.mk.ru only; the regional editions have no listing here. About 1,444 items
    were estimated missed from 2026-11-13 to 2026-11-17, the second most of any feed.

