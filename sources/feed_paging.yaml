# Feeds that take no page parameter, read back through the outlet's own numbered listing of its latest
# items (checked 2026-11-18 with the collector's helpers; robots.txt allows each listing URL).
- feed: https://www.mehrnews.com/rss
  type: page
  pages: https://www.mehrnews.com/archive?pi={n}
  first: 1
  max_pages: 6
  links: '^https://www\.mehrnews\.com/news/\d+/'
  verified: '2026-11-18'
  evidence: The feed ignores page parameters. /archive?pi=1 listed 21 to 29 of the feed's 30 items on three
    readings, and pi=2, pi=3 and pi=4 each listed about 30 older items with no repeats. About 1,032 items were
    estimated missed from 2026-11-13 to 2026-11-17, the third most of any feed.

