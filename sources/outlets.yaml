# Outlet registry. Single source of truth for what the tracker monitors.
#
# Rules:
#   - country is ISO 3166-1 alpha-3, language is ISO 639-1.
#   - Every feed listed here was verified to return items on the date in the
#     nearest "verified" note. pipeline/validate_sources.py rechecks weekly.
#   - Outlets publishing primarily in Chinese are recorded with active: false
#     and an inactive_reason, never deleted. See README for why.
#   - Prefer world or foreign affairs section feeds where the outlet offers
#     them, because China coverage concentrates there, and add the homepage
#     feed as a second feed so domestic stories with a China angle are caught.

