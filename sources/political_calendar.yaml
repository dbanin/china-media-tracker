# The propaganda calendar: fixed and announced Chinese political and propaganda dates from 1 September
# 2026 to 31 December 2027, read by pipeline/calendar_test.py (measure "calendar", report only). The
# shape is in sources/political_calendar_schema.json; check the file with
#   python -m pipeline.calendar_test validate [path]
#
# This file is the pre-registration (owner decision D9). It was compiled on 28 October 2026 from public
# sources, before the tracker's data for any date after that day existed. Windows that begin before 28
# October 2026 are a retrospective test: their dates were chosen while the data for them could already
# be seen, and the site says so. Windows that begin on or after 28 October 2026 are a forward test fixed
# in advance: the dates, the window, the keywords and the method were committed before the data. An entry
# added or changed later carries a later added_on and is reported as added after the pre-registration,
# never as part of it. Git history shows what was committed when.
#
# window        lead_days before an event's first day and lag_days after its last day belong to its
#               window. The same lead and lag for every event, fixed here before the data.
# events        each one:
#   id          lower case letters, digits and _, unique
#   name        the event in plain words
#   start, end  the first and last day (YYYY-MM-DD, end may equal start). Both null for an event whose
#               dates are not set yet; expected_period then says when it is expected, and it makes no
#               window until a later entry gives its dates.
#   category    party (Party congress, plenums), state (National Day, the Two Sessions), commemoration
#               (days set by law), anniversary (round anniversaries), holiday (festivals), summit (summits
#               China hosts), forum (forums and conferences China hosts), trade_fair (expos China hosts)
#   recurrence  annual_fixed (the same date every year), annual_lunar (a lunar calendar date),
#               annual_announced (every year, dates set by the organiser), biannual_announced (spring and
#               autumn sessions), five_yearly, one_off (a round anniversary or a summit China hosts once)
#   status      fixed (by law, by the calendar or by the lunar date), announced (dates published by the
#               organiser or the state), expected (inferred from the recurrence; not announced yet)
#   known_before_compiled  true when the dates were public before 28 October 2026; false for an expected
#               entry, whose dates are our own expectation, fixed here in advance
#   added_on    the day the entry was added to this file
#   keywords    words a state origin headline about the event would carry, any language, lower case;
#               the test reports the share of the window's state origin items whose headline has one
#   source_url, source_title  a public page a reader can check (https)
#   note        optional
#
# Left out, with the reason: the 2026 SCO summit (Kyrgyzstan), the 2026 BRICS summit (India) and the next
# FOCAC meeting are not hosted in China; no fourth Belt and Road Forum had been announced by 28 October
# 2026; the second China Arab States Summit, the 2027 BRICS summit and the 21st Party Congress are listed
# without dates because none had been announced.
